<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erweiterte Hormon-Simulation - Regelkreis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f1f5f9;
            font-family: sans-serif;
        }
        .organ-card {
            border: 2px solid #94a3b8;
            border-radius: 1rem;
            padding: 1.25rem;
            background-color: white;
            text-align: center;
            width: 220px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            position: relative;
            z-index: 10;
        }
        .hormone {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        .trh { background-color: #f87171; } /* Rot */
        .tsh { background-color: #fbbf24; } /* Gelb */
        .t4 { background-color: #60a5fa; }  /* Blau */
        
        #animation-viewport {
            height: 700px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(to bottom, #ffffff, #f8fafc);
        }

        .status-bar-container {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .status-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .stimulation-plus {
            color: #22c55e;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .inhibition-minus {
            color: #ef4444;
            font-weight: bold;
            font-size: 1.5rem;
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl text-slate-800">Detaillierter Schilddrüsen-Regelkreis</h1>
            <div class="flex gap-2">
                <button onclick="toggleSimulation()" id="btn-main" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition shadow-md">
                    Simulation starten
                </button>
                <button onclick="triggerCold()" class="px-4 py-2 bg-cyan-100 text-cyan-700 border border-cyan-200 rounded-lg hover:bg-cyan-200 transition">
                    Kältereiz simulieren
                </button>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-sm text-slate-500">TRH Konz.</div>
                <div class="status-bar-container"><div id="bar-trh" class="status-bar-fill bg-red-400"></div></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-sm text-slate-500">TSH Konz.</div>
                <div class="status-bar-container"><div id="bar-tsh" class="status-bar-fill bg-yellow-400"></div></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-sm text-slate-500">T4/T3 Konz. (Blut)</div>
                <div class="status-bar-container"><div id="bar-t4" class="status-bar-fill bg-blue-400"></div></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-sm text-slate-500">Stoffwechselrate</div>
                <div class="status-bar-container"><div id="bar-metabolism" class="status-bar-fill bg-green-500"></div></div>
            </div>
        </div>

        <div id="animation-viewport" class="rounded-2xl border border-slate-200 shadow-inner flex flex-col items-center justify-between py-12">
            
            <div id="organ-hypothalamus" class="organ-card">
                <div>Hypothalamus</div>
                <div class="text-[10px] uppercase tracking-wider text-slate-400">Oberste Schaltstelle</div>
            </div>

            <div class="flex items-center gap-4">
                <div class="stimulation-plus">+</div>
                <div class="h-16 w-0.5 bg-slate-200"></div>
            </div>

            <div id="organ-hypophyse" class="organ-card">
                <div>Hypophyse</div>
                <div class="text-[10px] uppercase tracking-wider text-slate-400">Hormondrüse</div>
            </div>

            <div class="flex items-center gap-4">
                <div class="stimulation-plus">+</div>
                <div class="h-16 w-0.5 bg-slate-200"></div>
            </div>

            <div id="organ-schilddruese" class="organ-card">
                <div>Schilddrüse</div>
                <div class="text-[10px] uppercase tracking-wider text-slate-400">Effektororgan</div>
            </div>

            <!-- Zielzellen unten -->
            <div id="organ-zellen" class="w-full max-w-md border-t-4 border-blue-100 mt-8 pt-4 text-center">
                <div class="text-slate-400 text-xs italic">Körperzellen (Stoffwechselaktivität)</div>
            </div>

            <!-- Feedback Overlay -->
            <div id="feedback-path" class="absolute left-10 top-1/2 -translate-y-1/2 border-l-2 border-t-2 border-b-2 border-dashed border-red-300 w-32 h-3/4 rounded-l-3xl pointer-events-none opacity-20 transition-opacity">
                <div class="absolute top-0 -left-3 inhibition-minus">−</div>
                <div class="absolute top-1/2 -left-20 -translate-y-1/2 rotate-[-90deg] text-[10px] text-red-400 font-bold tracking-widest">NEGATIVE RÜCKKOPPLUNG</div>
            </div>
        </div>
    </div>

    <script>
        let running = false;
        let levels = { trh: 0, tsh: 0, t4: 20, metabolism: 10 };
        const viewport = document.getElementById('animation-viewport');
        const organs = {
            hypothalamus: document.getElementById('organ-hypothalamus'),
            hypophyse: document.getElementById('organ-hypophyse'),
            schilddruese: document.getElementById('organ-schilddruese'),
            zellen: document.getElementById('organ-zellen')
        };

        function updateUI() {
            document.getElementById('bar-trh').style.width = `${levels.trh}%`;
            document.getElementById('bar-tsh').style.width = `${levels.tsh}%`;
            document.getElementById('bar-t4').style.width = `${levels.t4}%`;
            document.getElementById('bar-metabolism').style.width = `${levels.metabolism}%`;
            
            const feedbackPath = document.getElementById('feedback-path');
            feedbackPath.style.opacity = levels.t4 > 60 ? '1' : '0.2';
        }

        function spawnHormone(type, fromEl, toEl, onReach) {
            const fRect = fromEl.getBoundingClientRect();
            const tRect = toEl.getBoundingClientRect();
            const vRect = viewport.getBoundingClientRect();

            const h = document.createElement('div');
            h.className = `hormone ${type}`;
            
            let startX = (fRect.left + fRect.width/2) - vRect.left;
            let startY = (fRect.bottom) - vRect.top;
            let endY = (tRect.top) - vRect.top;
            
            // Sonderfall T4 Rückkopplung
            if (type === 't4_feedback') {
                h.className = 'hormone t4';
                startX = (fRect.left) - vRect.left;
                startY = (fRect.top + fRect.height/2) - vRect.top;
                endY = (organs.hypothalamus.getBoundingClientRect().top + 20) - vRect.top;
            }

            h.style.left = `${startX}px`;
            h.style.top = `${startY}px`;
            viewport.appendChild(h);

            let currY = startY;
            const speed = 2 + Math.random();

            function animate() {
                if (!running) { h.remove(); return; }
                
                if (type === 't4_feedback') {
                    currY -= speed;
                    const progress = (startY - currY) / (startY - endY);
                    const curve = Math.sin(progress * Math.PI) * 120;
                    h.style.left = `${startX - curve}px`;
                    h.style.top = `${currY}px`;
                    if (currY <= endY) { h.remove(); if(onReach) onReach(); }
                    else requestAnimationFrame(animate);
                } else {
                    currY += speed;
                    h.style.top = `${currY}px`;
                    if (currY >= endY) { h.remove(); if(onReach) onReach(); }
                    else requestAnimationFrame(animate);
                }
            }
            requestAnimationFrame(animate);
        }

        function logicCycle() {
            if (!running) return;

            // 1. Hypothalamus entscheidet basierend auf T4-Spiegel
            const inhibition = levels.t4 / 100; // 0 bis 1
            if (Math.random() > (0.2 + inhibition)) {
                levels.trh = Math.min(100, levels.trh + 5);
                spawnHormone('trh', organs.hypothalamus, organs.hypophyse, () => {
                    // 2. TSH Produktion
                    levels.tsh = Math.min(100, levels.tsh + 8);
                    spawnHormone('tsh', organs.hypophyse, organs.schilddruese, () => {
                        // 3. T4 Produktion
                        levels.t4 = Math.min(100, levels.t4 + 12);
                        // T4 geht zu Zellen
                        spawnHormone('t4', organs.schilddruese, organs.zellen, () => {
                            levels.metabolism = Math.min(100, levels.t4 * 0.9);
                        });
                        // T4 geht zurück zur Kontrolle
                        spawnHormone('t4_feedback', organs.schilddruese, organs.hypothalamus);
                    });
                });
            }

            // Natürlicher Abbau
            levels.trh = Math.max(0, levels.trh - 2);
            levels.tsh = Math.max(0, levels.tsh - 2);
            levels.t4 = Math.max(5, levels.t4 - 3);
            levels.metabolism = Math.max(5, levels.metabolism - 2);

            updateUI();
            setTimeout(logicCycle, 1000);
        }

        function toggleSimulation() {
            running = !running;
            const btn = document.getElementById('btn-main');
            btn.textContent = running ? 'Simulation stoppen' : 'Simulation starten';
            btn.className = running ? 'px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition shadow-md' : 'px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition shadow-md';
            if (running) logicCycle();
        }

        function triggerCold() {
            // Kälte erhöht den TRH Ausstoß im Hypothalamus
            if (!running) toggleSimulation();
            levels.trh = Math.min(100, levels.trh + 40);
            updateUI();
        }

        // Initialisierung
        updateUI();
    </script>
</body>
</html>
