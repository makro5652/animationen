<style>
:root{
  --bg:#F4F5F0; --surface:#FFFFFF; --sunk:#EBEDE6; --ink:#1C2430; --muted:#5A6472; --line:#D3D8CE;
  --accent:#2E7D46; --accent-soft:#E2F0E5; --on-accent:#fff;
  --aff:#2B3443; --hl:#D98A00; --hl-soft:#FCEFD3; --ok:#1E7A4C; --ok-soft:#DFF2E7; --bad:#B4372B; --bad-soft:#F8E2DE;
  --lvR:#0F7C86; --lvG:#2D5FB8; --lvO:#7A47A8;
  --lv:var(--lvR);
  --r:12px; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
body[data-level="G"]{--lv:var(--lvG)} body[data-level="O"]{--lv:var(--lvO)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--lv);outline-offset:2px}
sub{font-size:.7em;line-height:0}
h1,h2,h3,h4{line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:1.55rem} h3{font-size:1.18rem} h4{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}

/* Kopf */
.top{position:sticky;top:0;z-index:30;background:rgba(244,245,240,.94);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.brand a{color:var(--muted);text-decoration:none;font-size:.85rem;white-space:nowrap}
.brand h1{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.levels{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.levels button{border:0;background:transparent;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:.92rem;color:var(--muted)}
.levels button[aria-pressed="true"]{background:var(--surface);color:var(--lv);box-shadow:var(--shadow)}
.pts{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;min-height:40px;font-variant-numeric:tabular-nums}
.pts .star{color:var(--hl)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:6px 14px;font-weight:600;font-size:.92rem}
nav.tabs{max-width:1160px;margin:0 auto;display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 14px;min-height:44px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunk);font-size:.8rem;margin-right:6px}

nav.tabs button[aria-selected="true"] .n{background:var(--lv);color:#fff}
nav.tabs button .chk{color:var(--ok);margin-left:6px}

main{max-width:1160px;margin:0 auto;padding:20px 16px calc(60px + env(safe-area-inset-bottom))}
.lvbadge{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--lv);border-radius:6px;padding:2px 8px;vertical-align:middle}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--lv);margin-bottom:4px}
.section-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}

.warn{border-left:4px solid var(--hl);background:var(--hl-soft);padding:10px 14px;border-radius:0 10px 10px 0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:46px;font-weight:600}

.fb{margin-top:12px;padding:12px 14px;border-radius:10px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 40%,white)}
.fb.bad{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 40%,white)}
.fb.info{background:var(--hl-soft);border:1px solid color-mix(in srgb,var(--hl) 40%,white)}
.fb b.v{display:block;margin-bottom:2px}

/* Stammbaum */
.ped{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pedwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;overflow-x:auto}

.ped .ln{stroke:var(--ink);stroke-width:2;fill:none}
.ped .sym{stroke:var(--ink);stroke-width:2.2;fill:#fff}
.ped .sym.aff{fill:var(--aff)}
.ped .num{font-size:14px;fill:var(--muted);font-family:var(--sans)}
.ped .gt{font-size:15px;fill:var(--ink);font-family:var(--sans);font-weight:600}
.ped .gt.ok{fill:var(--ok)} .ped .gt.bad{fill:var(--bad)} .ped .gt.q{fill:var(--lv)}
.ped .genl{font-size:14px;fill:var(--muted);font-weight:700;font-family:var(--sans)}
.ped .ring{fill:none;stroke-width:4}
.ped .ring.hl{stroke:var(--hl)} .ped .ring.ok{stroke:var(--ok)} .ped .ring.bad{stroke:var(--bad)} .ped .ring.sel{stroke:var(--lv);stroke-dasharray:6 4}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.86rem;color:var(--muted);margin-top:6px;align-items:center}

.wiz{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}

@media (orientation:portrait) and (max-width:1100px){.wiz{grid-template-columns:1fr}}

.qtitle{font-weight:700;font-size:1.06rem;margin-bottom:8px}
.tapprompt{display:inline-flex;align-items:center;gap:8px;background:var(--hl-soft);border:1px dashed var(--hl);border-radius:10px;padding:8px 12px;margin-top:10px;font-weight:600}
.sheet{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--sunk)}
.sheet .btnrow{margin-top:8px}

/* Tabellen */
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}

.punnett{border-collapse:collapse;margin:8px 0}

.punnett td.car{background:var(--hl-soft)}
.sel{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface)}

/* Unterreiter */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:600}
.subtabs button[aria-selected="true"]{border-color:var(--lv);color:#fff;background:var(--lv)}

/* Fortschritt */
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--lv);border-radius:5px;transition:width .4s}
.kpi{display:flex;gap:12px;flex-wrap:wrap}
.kpi div{flex:1 1 140px;background:var(--sunk);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.pathcard{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.pathcard .n{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--lv);color:#fff;font-weight:700}
.pathcard small{display:block;color:var(--muted)}

/* Lückentext */
.gap{display:inline-block;min-width:8em;margin:2px 4px}
.gap.ok{border-color:var(--ok);background:var(--ok-soft)} .gap.bad{border-color:var(--bad);background:var(--bad-soft)}
.cloze p{margin:10px 0;line-height:2.1}

/* Wortspeicher */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(20,25,35,.35)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--surface);padding:calc(16px + env(safe-area-inset-top)) 18px 24px;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer .panel h2{margin-bottom:6px}
dl.ws{margin:12px 0 0}
dl.ws dt{font-weight:700;margin-top:12px} dl.ws dt span{font-weight:400;color:var(--muted)}
dl.ws dd{margin:2px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.mini{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mini .pedwrap{flex:0 0 auto;width:150px;padding:4px}
.tfrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
@media (max-width:640px){.tfrow{grid-template-columns:110px minmax(0,1fr)}.tfrow .btnrow{grid-column:1/-1}}
.optgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.optgrid{grid-template-columns:1fr}}
.pedopt{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;text-align:left}
.pedopt[aria-pressed="true"]{border-color:var(--lv)}
.pedopt.ok{border-color:var(--ok);background:var(--ok-soft)} .pedopt.bad{border-color:var(--bad);background:var(--bad-soft)}
.pedopt .lab{font-weight:700;padding:2px 6px}
.flow{display:flex;flex-direction:column;gap:0}
.flow .fs{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.flow .fs:first-child{border-top:0}
.flow .fs .k{width:44px;height:44px;border-radius:12px;background:var(--lv);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.arrowto{font-weight:700;color:var(--ok)}
.bars .row{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 54px;gap:10px;align-items:center;margin:6px 0;font-size:.95rem}
.quizhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.big{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--lv)}
footer{max-width:1160px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.88rem;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
footer button{border:0;background:none;color:var(--muted);text-decoration:underline;min-height:44px;padding:0}
@media (max-width:560px){body{font-size:16px}.brand h1{font-size:1rem}.levels button{padding:8px 10px}}
@media print{.top,nav.tabs,footer,.toast{display:none}}
.navlink{flex:0 0 auto;align-self:center;margin-left:auto;padding:8px 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:10px;font-weight:700;color:var(--ok);text-decoration:none;border:1px solid color-mix(in srgb,var(--ok) 40%,white);background:var(--ok-soft);white-space:nowrap}
.punnett{border-collapse:collapse;margin:8px 0}
.punnett th,.punnett td{border:1px solid var(--line);text-align:center;font-weight:600;padding:0}

.punnett th.corner{font-size:.78rem;font-weight:600;color:var(--muted)}
.punnett.show td{width:84px;height:66px;vertical-align:middle}

input.sel.ok{border-color:var(--ok);background:var(--ok-soft)} input.sel.bad{border-color:var(--bad);background:var(--bad-soft)}

<body data-level="R">
<header class="top">
  <div class="bar">
    <div class="brand"><a href="index.html" aria-label="Zur Übersicht">← Übersicht</a><h1>Mendelsche Regeln · Arbeitsblatt</h1></div>
    <div class="levels" role="group" aria-label="Niveau wählen">
      <button data-lv="R" aria-pressed="true">Realschule</button><button data-lv="G" aria-pressed="false">Gymnasium</button>
    </div>
    <button class="iconbtn" id="wsbtn">Wortspeicher</button>
    <div class="pts" title="Punkte"><span class="star">★</span><span id="pts">0</span></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Kapitel"></nav>
</header>
<main></main>
<footer><span>Klassische Genetik nach Gregor Mendel. Fortschritt wird nur auf diesem Gerät gespeichert. · <a href="stammbaum-selbstlernkurs.html" style="color:inherit">Weiter: Stammbaumanalyse</a></span><span><button id="reset">Fortschritt zurücksetzen</button></span></footer>
<div class="drawer" id="drawer"><div class="scrim"></div><div class="panel"><div class="btnrow" style="justify-content:flex-end"><button class="btn close">Schließen</button></div><div class="body"></div></div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= Zustand ================= */
const KEY = 'mendel-regeln-v1';
const S = (() => { let s = null; try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} return Object.assign({ level: 'R', points: 0, done: {}, tab: 'start', ws: null }, s || {}); })();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function award(key, pts) { if (!pts || S.done[key] !== undefined) return 0; S.done[key] = pts; S.points += pts; save(); updateHeader(); toast('+' + pts + ' Punkte'); return pts; }
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const DI = {

  meerdi: { name: 'Meerschweinchen: Fellfarbe und Fellstruktur', genes: ['meer', 'fell'] }
};

const COL = { gelb: '#E9C935', 'grün': '#6FA33A', violett: '#8A5AB8', 'weiß': '#FFFFFF', rot: '#D23B3B', rosa: '#F3A0BE', schwarz: '#262626', braun: '#8A5A2E' };

/* ================= Genetik ================= */
function norm1(e, a, b) { return a === e.al[0] ? a + b : b === e.al[0] ? b + a : a + b; }
function ph1(e, g) { if (e.inh === 'int') return g === e.al[0] + e.al[0] ? e.ph[0] : g === e.al[1] + e.al[1] ? e.ph[2] : e.ph[1]; return g.indexOf(e.al[0]) >= 0 ? e.ph[0] : e.ph[1]; }
function genes(sys) { return DI[sys] ? DI[sys].genes.map(k => EX[k]) : [EX[sys]]; }
function sysName(sys) { return DI[sys] ? DI[sys].name : EX[sys].name; }
function gametes(sys, g) {
  const gs = genes(sys);
  if (gs.length === 1) return [g[0], g[1]];
  return [g[0] + g[2], g[0] + g[3], g[1] + g[2], g[1] + g[3]];
}
function child(sys, a, b) { const gs = genes(sys); return gs.map((e, i) => norm1(e, a[i], b[i])).join(''); }
function pheno(sys, g) { const gs = genes(sys); return gs.map((e, i) => ph1(e, g.slice(2 * i, 2 * i + 2))).join(', '); }
function allGenos(sys) {
  const gs = genes(sys), one = e => [e.al[0] + e.al[0], e.al[0] + e.al[1], e.al[1] + e.al[1]];
  if (gs.length === 1) return one(gs[0]);
  const r = []; one(gs[0]).forEach(a => one(gs[1]).forEach(b => r.push(a + b))); return r;
}
function phenoList(sys) {
  const gs = genes(sys);
  if (gs.length === 1) return gs[0].inh === 'int' ? gs[0].ph.slice() : gs[0].ph.slice();
  const r = []; gs[0].ph.forEach(a => gs[1].ph.forEach(b => r.push(a + ', ' + b))); return r;
}
function cross(sys, g1, g2) {
  const ga = gametes(sys, g1), gb = gametes(sys, g2), cells = [];
  gb.forEach(b => ga.forEach(a => cells.push(child(sys, a, b))));
  const gc = {}, pc = {}; cells.forEach(c => { gc[c] = (gc[c] || 0) + 1; const p = pheno(sys, c); pc[p] = (pc[p] || 0) + 1; });
  return { ga, gb, cells, gc, pc };
}
function ratio(counts, order) {
  const v = order.map(k => counts[k] || 0).filter(x => x > 0);
  const g = v.reduce((a, b) => { while (b) [a, b] = [b, a % b]; return a; });
  if (v.length === 1) return 'alle gleich (uniform)';
  return v.map(x => x / g).join(' : ');
}
function homDom(sys) { return genes(sys).map(e => e.al[0] + e.al[0]).join(''); }
function homRec(sys) { return genes(sys).map(e => e.al[1] + e.al[1]).join(''); }
function het(sys) { return genes(sys).map(e => e.al[0] + e.al[1]).join(''); }

/* ================= Zeichnungen ================= */
function pea(color, wrinkled, s) {
  s = s || 34; const c = s / 2, r = s * .4;
  const fill = color || '#D8C48E';
  if (!wrinkled) return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="#1C2430" stroke-width="1.6"/><ellipse cx="${c - r * .35}" cy="${c - r * .35}" rx="${r * .25}" ry="${r * .16}" fill="#fff" opacity=".55"/></svg>`;
  let pts = []; for (let i = 0; i < 14; i++) { const ang = i / 14 * Math.PI * 2, rr = i % 2 ? r * .78 : r; pts.push((c + rr * Math.cos(ang)).toFixed(1) + ',' + (c + rr * Math.sin(ang)).toFixed(1)); }
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><polygon points="${pts.join(' ')}" fill="${fill}" stroke="#1C2430" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function flower(color, s) {
  s = s || 34; const c = s / 2, r = s * .2; let p = '';
  for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 - Math.PI / 2; p += `<circle cx="${(c + r * 1.05 * Math.cos(a)).toFixed(1)}" cy="${(c + r * 1.05 * Math.sin(a)).toFixed(1)}" r="${r}" fill="${color}" stroke="#1C2430" stroke-width="1.3"/>`; }
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">${p}<circle cx="${c}" cy="${c}" r="${r * .55}" fill="#F2C94C" stroke="#1C2430" stroke-width="1"/></svg>`;
}
function pig(color, rough, s) {
  s = s || 40; const w = s, h = s * .7;
  const tufts = rough ? [[.3, .22], [.5, .16], [.7, .22], [.4, .5], [.62, .5]].map(([x, y]) => `<path d="M${w * x - 4} ${h * y + 3} l4 -6 l4 6" fill="none" stroke="${color === COL.schwarz ? '#bbb' : '#3b2614'}" stroke-width="1.6"/>`).join('') : '';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><ellipse cx="${w * .48}" cy="${h * .55}" rx="${w * .38}" ry="${h * .36}" fill="${color}" stroke="#1C2430" stroke-width="1.5"/><circle cx="${w * .82}" cy="${h * .45}" r="${h * .24}" fill="${color}" stroke="#1C2430" stroke-width="1.5"/><ellipse cx="${w * .78}" cy="${h * .2}" rx="${w * .07}" ry="${h * .1}" fill="${color}" stroke="#1C2430" stroke-width="1.3"/><circle cx="${w * .88}" cy="${h * .42}" r="1.8" fill="${color === COL.schwarz ? '#fff' : '#111'}"/>${tufts}</svg>`;
}
function icon(sys, g, s) {
  const gs = genes(sys), keys = DI[sys] ? DI[sys].genes : [sys];
  const p = gs.map((e, i) => ph1(e, g.slice(2 * i, 2 * i + 2)));
  const get = k => p[keys.indexOf(k)];
  if (keys.indexOf('farbe') >= 0 || keys.indexOf('form') >= 0) return pea(get('farbe') ? COL[get('farbe')] : null, get('form') === 'kantig', s);
  if (keys.indexOf('meer') >= 0 || keys.indexOf('fell') >= 0) return pig(get('meer') ? COL[get('meer')] : '#B98B5A', get('fell') && get('fell') !== 'glatt', s);
  return flower(COL[p[0]], s);
}

/* ================= Bausteine ================= */
function mcBlock(el, cfg) {
  const order = cfg.noShuffle ? cfg.opts.map((_, i) => i) : shuffle(cfg.opts.map((_, i) => i));
  const corr = Array.isArray(cfg.a) ? cfg.a : [cfg.a]; let tries = 0;
  el.innerHTML = `${cfg.q ? `<div class="qtitle">${cfg.q}</div>` : ''}${cfg.multi ? '<p class="muted" style="font-size:.9rem">Mehrere Antworten können richtig sein.</p>' : ''}
    <div>${order.map(i => `<button class="opt" data-i="${i}" aria-pressed="false">${cfg.opts[i]}</button>`).join('')}</div>
    <div class="btnrow"><button class="btn primary chk">Prüfen</button></div><div class="fb"></div>`;
  const fb = $('.fb', el), chk = $('.chk', el);
  $$('.opt', el).forEach(b => b.onclick = () => { if (el.dataset.locked) return; if (!cfg.multi) $$('.opt', el).forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', cfg.multi && b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); });
  chk.onclick = () => {
    if (el.dataset.locked) { delete el.dataset.locked; chk.textContent = 'Prüfen'; $$('.opt', el).forEach(x => { x.classList.remove('ok', 'bad'); x.setAttribute('aria-pressed', 'false'); }); fb.className = 'fb'; return; }
    const sel = $$('.opt', el).filter(b => b.getAttribute('aria-pressed') === 'true').map(b => +b.dataset.i);
    if (!sel.length) { fb.className = 'fb show info'; fb.innerHTML = 'Wähle zuerst eine Antwort aus.'; return; }
    const right = sel.length === corr.length && sel.every(i => corr.indexOf(i) >= 0);
    $$('.opt', el).forEach(b => { const i = +b.dataset.i; if (corr.indexOf(i) >= 0) b.classList.add('ok'); else if (sel.indexOf(i) >= 0) b.classList.add('bad'); });
    if (right && tries === 0 && cfg.key) award(cfg.key, cfg.pts || 2); tries++;
    fb.className = 'fb show ' + (right ? 'ok' : 'bad'); fb.innerHTML = `<b class="v">${right ? 'Richtig.' : 'Falsch.'}</b>${cfg.ex || ''}`;
    el.dataset.locked = 1; chk.textContent = 'Nochmal';
  };
}
/* Kreuzungsquadrat zum Ausfüllen */
function punnettTask(el, cfg) {
  // cfg: sys, g1, g2, gamGiven, key, pts, onDone
  const sys = cfg.sys, X = cross(sys, cfg.g1, cfg.g2), n = X.ga.length;
  const gamOpts = Array.from(new Set(gametes(sys, het(sys)).concat(gametes(sys, homDom(sys))).concat(gametes(sys, homRec(sys)))));
  const ans = {}, gA = {}, gB = {}; let sel = null, checked = false;
  const di = n === 4;
  const draw = () => {
    const opts = allGenos(sys);
    let h = `<div class="ptask"><p class="muted" style="font-size:.92rem">${cfg.gamGiven ? 'Die Keimzellen sind eingetragen.' : 'Trage zuerst die Keimzellen der Eltern ein (Auswahlfelder).'} Tippe dann eine Zelle an und wähle den Genotyp des Nachkommen.</p>
      <div style="overflow-x:auto"><table class="punnett ${di ? 'di' : ''}"><tr><th class="corner">♀ \\ ♂<br><small>${cfg.g2} \\ ${cfg.g1}</small></th>`;
    X.ga.forEach((a, i) => h += `<th>${cfg.gamGiven ? a : `<select class="sel gsel" data-s="a" data-i="${i}"><option value="">?</option>${gamOpts.map(o => `<option ${gA[i] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`}</th>`);
    h += '</tr>';
    X.gb.forEach((b, j) => {
      h += `<tr><th>${cfg.gamGiven ? b : `<select class="sel gsel" data-s="b" data-i="${j}"><option value="">?</option>${gamOpts.map(o => `<option ${gB[j] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`}</th>`;
      X.ga.forEach((a, i) => {
        const k = j * n + i, v = ans[k], cls = checked ? (v === X.cells[k] ? 'okc' : 'badc') : sel === k ? 'selc' : '';
        h += `<td><button class="cell ${cls}" data-k="${k}">${v ? `${icon(sys, v, di ? 22 : 28)}<span>${v}</span>` : '<span class="q">?</span>'}</button></td>`;
      });
      h += '</tr>';
    });
    h += `</table></div>`;
    if (sel !== null && !checked) h += `<div class="sheet">Zelle wählen: <div class="btnrow">${opts.map(o => `<button class="chip gch" data-g="${o}" aria-pressed="${ans[sel] === o}">${o}</button>`).join('')}</div></div>`;
    const filled = Object.keys(ans).length, gfill = cfg.gamGiven || (Object.keys(gA).length === n && Object.keys(gB).length === n);
    h += `<div class="btnrow" style="margin-top:10px">${checked ? '<button class="btn again">Neu ausfüllen</button><button class="btn solv">Lösung eintragen</button>' : `<button class="btn primary pchk" ${filled < n * n || !gfill ? 'disabled' : ''}>Prüfen</button>`}</div><div class="fb"></div>`;
    el.innerHTML = h;
    $$('.gsel', el).forEach(s => s.onchange = () => { (s.dataset.s === 'a' ? gA : gB)[+s.dataset.i] = s.value; if (!s.value) delete (s.dataset.s === 'a' ? gA : gB)[+s.dataset.i]; draw(); });
    $$('.cell', el).forEach(c => c.onclick = () => { if (checked) return; sel = +c.dataset.k; draw(); });
    $$('.gch', el).forEach(c => c.onclick = () => { ans[sel] = c.dataset.g; const nx = Array.from({ length: n * n }, (_, k) => k).find(k => !ans[k]); sel = nx === undefined ? null : nx; draw(); });
    const pc = $('.pchk', el); if (pc) pc.onclick = () => {
      checked = true; sel = null;
      let ok = 0; X.cells.forEach((c, k) => { if (ans[k] === c) ok++; });
      // Keimzellen: Reihenfolge egal, Menge muss stimmen
      const same = (u, v) => u.slice().sort().join() === v.slice().sort().join();
      const gamOk = cfg.gamGiven || (same(Object.values(gA), X.ga) && same(Object.values(gB), X.gb));
      // Zellen gegen die vom Lernenden gewählten Keimzellen prüfen (wenn Keimzellen richtig, aber andere Reihenfolge)
      if (!cfg.gamGiven && gamOk) { ok = 0; X.gb.forEach((_, j) => X.ga.forEach((_, i) => { if (ans[j * n + i] === child(sys, gA[i], gB[j])) ok++; })); }
      const all = ok === n * n && gamOk;
      if (all && cfg.key) award(cfg.key, cfg.pts || 3);
      draw();
      if (!cfg.gamGiven && gamOk) $$('.cell', el).forEach(c => { const k = +c.dataset.k, i = k % n, j = Math.floor(k / n); c.classList.remove('okc', 'badc'); c.classList.add(ans[k] === child(sys, gA[i], gB[j]) ? 'okc' : 'badc'); });
      const fb = $('.fb', el); fb.className = 'fb show ' + (all ? 'ok' : 'bad');
      fb.innerHTML = `<b class="v">${all ? 'Richtig ausgefüllt.' : 'Noch nicht ganz.'}</b>${gamOk ? '' : 'Die Keimzellen stimmen nicht. Jede Keimzelle erhält von jedem Gen nur <b>ein</b> Allel. '}${ok} von ${n * n} Zellen richtig.` + summaryHTML(sys, X);
      if (cfg.onDone) cfg.onDone(all);
    };
    const ag = $('.again', el); if (ag) ag.onclick = () => { checked = false; Object.keys(ans).forEach(k => delete ans[k]); draw(); };
    const sv = $('.solv', el); if (sv) sv.onclick = () => { X.ga.forEach((a, i) => gA[i] = a); X.gb.forEach((b, j) => gB[j] = b); X.cells.forEach((c, k) => ans[k] = c); draw(); const fb = $('.fb', el); fb.className = 'fb show info'; fb.innerHTML = '<b class="v">Lösung eingetragen.</b>' + summaryHTML(sys, X); };
  };
  draw();
}
function summaryHTML(sys, X) {
  const go = allGenos(sys).filter(g => X.gc[g]), po = phenoList(sys).filter(p => X.pc[p]);
  return `<div style="margin-top:8px"><b>Genotypen:</b> ${go.map(g => `${g} (${X.gc[g]})`).join(', ')} → ${ratio(X.gc, go)}<br><b>Phänotypen:</b> ${po.map(p => `${p} (${X.pc[p]})`).join(', ')} → ${ratio(X.pc, po)}</div>`;
}
/* fertiges Kreuzungsschema (Anzeige) */
function schemaHTML(sys, g1, g2, opt) {
  opt = opt || {}; const X = cross(sys, g1, g2), n = X.ga.length, di = n === 4;
  let h = `<table class="punnett show ${di ? 'di' : ''}"><tr><th class="corner">♀ \\ ♂</th>${X.ga.map(a => `<th>${a}</th>`).join('')}</tr>`;
  X.gb.forEach((b, j) => { h += `<tr><th>${b}</th>${X.ga.map((a, i) => { const c = X.cells[j * n + i]; return `<td>${icon(sys, c, di ? 22 : 28)}<span>${c}</span></td>`; }).join('')}</tr>`; });
  return h + '</table>' + (opt.sum === false ? '' : summaryHTML(sys, X));
}
function genLine(sys, g, label) { return `<div class="gen"><span class="glab">${label}</span>${icon(sys, g, 34)}<span><b>${g}</b><br><small>${pheno(sys, g)}</small></span></div>`; }

/* ---------- Grundbegriffe ---------- */
const TERMS = [
  ['Gen', 'Abschnitt der DNA, der die Information für ein Merkmal enthält (z. B. für die Samenfarbe).'],
  ['Allel', 'eine Variante (Form) eines Gens, z. B. G für gelbe und g für grüne Samen. Jede Körperzelle enthält von jedem Gen zwei Allele – eines von der Mutter, eines vom Vater.'],
  ['dominant', 'Das Allel bestimmt das Merkmal schon, wenn es nur einmal vorhanden ist. Man schreibt es mit einem Großbuchstaben (G).'],
  ['rezessiv', 'Das Allel prägt sich nur aus, wenn kein dominantes Allel vorhanden ist. Kleinbuchstabe (g).'],
  ['intermediär', 'Keines der beiden Allele ist dominant. Mischerbige zeigen eine Zwischenform, z. B. rosa Blüten bei der Wunderblume.'],
  ['homozygot (reinerbig)', 'zwei gleiche Allele: GG oder gg.'],
  ['heterozygot (mischerbig)', 'zwei verschiedene Allele: Gg.'],
  ['Genotyp', 'die Allele, die ein Lebewesen für ein Merkmal besitzt (GG, Gg oder gg).'],
  ['Phänotyp', 'das Erscheinungsbild, z. B. gelbe Samen.'],
  ['P, F₁, F₂', 'Parentalgeneration (Eltern), 1. und 2. Filialgeneration (Tochtergenerationen).'],
  ['Keimzelle (Gamet)', 'Eizelle oder Pollen-/Spermienzelle. Sie enthält von jedem Gen nur ein Allel.'],
  ['Kreuzungsquadrat', 'Tabelle, in der man die Keimzellen beider Eltern kombiniert, um die Genotypen der Nachkommen zu erhalten.'],
  ['monohybrid / dihybrid', 'Die Eltern unterscheiden sich in einem Merkmal bzw. in zwei Merkmalen.']
];
function pgBasics(m) {
  const g = S.level === 'G';

      ex: 'Das rezessive Merkmal (grün) taucht in der F₂ wieder auf – bei einem Viertel der Nachkommen.' + (g ? ' Erklärung: In der Meiose werden die beiden Allele auf verschiedene Keimzellen verteilt (Trennung der homologen Chromosomen).' : '') },
    r3: { t: '3. Mendelsche Regel: Unabhängigkeitsregel (Neukombinationsregel)', merk: 'Unterscheiden sich die Eltern in <b>zwei</b> Merkmalen, werden die Allele der beiden Gene <b>unabhängig voneinander</b> vererbt. In der F₂ treten auch <b>neue Merkmalskombinationen</b> auf; der Phänotyp spaltet im Verhältnis <b>9 : 3 : 3 : 1</b>.',

    ri: { t: 'Intermediärer Erbgang', merk: 'Ist keines der beiden Allele dominant, zeigen die Mischerbigen eine <b>Zwischenform</b>. Die Regeln 1 und 2 gelten trotzdem: F₁ ist uniform, in der F₂ spaltet auch der Phänotyp im Verhältnis <b>1 : 2 : 1</b>.',

    r3: { q: 'Wie viele verschiedene Keimzellsorten bildet eine Pflanze mit dem Genotyp GgRr?', opts: ['4', '2', '1', '16'], a: 0, ex: 'GR, Gr, gR, gr – jede Kombination aus einem Allel pro Gen.' },
    ri: { q: 'Zwei rosa Wunderblumen (RW × RW) werden gekreuzt. Welches Verhältnis erwartest du im Phänotyp?', opts: ['1 rot : 2 rosa : 1 weiß', '3 rosa : 1 weiß', 'alle rosa', '3 rot : 1 weiß'], a: 0, ex: 'Beim intermediären Erbgang entspricht das Phänotypverhältnis dem Genotypverhältnis.' },
    rr: { q: 'Ein schwarzes Meerschweinchen wird mit einem braunen (bb) gekreuzt. Von 8 Jungen sind 4 braun. Welchen Genotyp hat das schwarze Tier?', opts: ['Bb', 'BB', 'bb', 'nicht bestimmbar'], a: 0, ex: 'Braune Junge (bb) haben von beiden Eltern ein b erhalten – das schwarze Tier muss Bb sein.' },
    rg: { q: 'Zwei Gene liegen eng benachbart auf demselben Chromosom. Was erwartest du in der F₂ einer dihybriden Kreuzung?', opts: ['Kaum Neukombinationen – keine 9 : 3 : 3 : 1-Aufspaltung', 'genau 9 : 3 : 3 : 1', 'alle Nachkommen gleich', '1 : 1 : 1 : 1'], a: 0, ex: 'Gekoppelte Gene werden meist gemeinsam vererbt; Neukombinationen entstehen nur durch seltenes Crossing-over.' }

/* ---------- Kreuzungslabor ---------- */
let LAB = { sys: 'farbe', g1: 'Gg', g2: 'Gg' };
function pgLab(m) {
  const sysList = MONO_LIST.concat(['wunder', 'erbse', 'meer2']);
  if (!genesOK(LAB.sys)) LAB = { sys: 'farbe', g1: 'Gg', g2: 'Gg' };
  const all = allGenos(LAB.sys);
  m.innerHTML = `<div class="section-head"><div class="eyebrow">Experimentieren</div><h2>Kreuzungslabor</h2><p>Wähle ein Beispiel und die Genotypen der Eltern. Das Kreuzungsquadrat zeigt die erwarteten Nachkommen. Mit der Simulation erzeugst du zufällig echte Nachkommen – wie Mendel beim Auszählen.</p></div>
    <div class="card"><div class="btnrow"><label>Beispiel <select class="sel" id="lsys">${[...MONO_LIST, 'wunder'].map(k => `<option value="${k}" ${k === LAB.sys ? 'selected' : ''}>${EX[k].name}</option>`).join('')}${Object.keys(DI).map(k => `<option value="${k}" ${k === LAB.sys ? 'selected' : ''}>${DI[k].name} (dihybrid)</option>`).join('')}</select></label></div>
      <div class="btnrow" style="margin-top:10px"><label>Elternteil 1 <select class="sel" id="lg1">${all.map(g => `<option ${g === LAB.g1 ? 'selected' : ''}>${g}</option>`).join('')}</select></label><label>Elternteil 2 <select class="sel" id="lg2">${all.map(g => `<option ${g === LAB.g2 ? 'selected' : ''}>${g}</option>`).join('')}</select></label></div>
      <div class="btnrow" style="margin-top:10px"><span class="muted">Schnellwahl:</span><button class="chip" data-q="p">P: reinerbig × reinerbig</button><button class="chip" data-q="f">F₁ × F₁</button>${S.level === 'G' ? '<button class="chip" data-q="r">Rückkreuzung</button>' : ''}</div></div>
    <div class="grid2" style="margin-top:16px"><div class="card"><h3>Eltern</h3><div class="pair">${genLine(LAB.sys, LAB.g1, '♂')}${genLine(LAB.sys, LAB.g2, '♀')}</div><p style="margin:10px 0 6px"><b>Keimzellen:</b> ♂ ${uniq(gametes(LAB.sys, LAB.g1)).join(', ')} · ♀ ${uniq(gametes(LAB.sys, LAB.g2)).join(', ')}</p><div style="overflow-x:auto">${schemaHTML(LAB.sys, LAB.g1, LAB.g2)}</div></div>
      <div class="card"><h3>Simulation: Nachkommen zählen</h3><p class="muted" style="font-size:.92rem">Jeder Nachkomme erhält zufällig eine Keimzelle von jedem Elternteil.</p>
        <div class="btnrow" style="margin-top:8px">${[10, 100, 1000, 8000].map(n => `<button class="btn" data-n="${n}">${n.toLocaleString('de-DE')}</button>`).join('')}</div><div id="simout" style="margin-top:12px"></div></div></div>`;
  $('#lsys').onchange = e => { const s = e.target.value; LAB = { sys: s, g1: het(s), g2: het(s) }; pgLab(m); };
  $('#lg1').onchange = e => { LAB.g1 = e.target.value; pgLab(m); };
  $('#lg2').onchange = e => { LAB.g2 = e.target.value; pgLab(m); };
  $$('[data-q]', m).forEach(b => b.onclick = () => { const s = LAB.sys; if (b.dataset.q === 'p') { LAB.g1 = homDom(s); LAB.g2 = homRec(s); } else if (b.dataset.q === 'f') { LAB.g1 = LAB.g2 = het(s); } else { LAB.g1 = het(s); LAB.g2 = homRec(s); } pgLab(m); });
  $$('[data-n]', m).forEach(b => b.onclick = () => simulate(+b.dataset.n));
}
function genesOK(s) { return !!(EX[s] || DI[s]); }
function uniq(a) { return Array.from(new Set(a)); }
function simulate(n) {
  const sys = LAB.sys, ga = gametes(sys, LAB.g1), gb = gametes(sys, LAB.g2), cnt = {};
  for (let i = 0; i < n; i++) { const c = child(sys, ga[Math.floor(Math.random() * ga.length)], gb[Math.floor(Math.random() * gb.length)]); const p = pheno(sys, c); cnt[p] = (cnt[p] || 0) + 1; }
  const X = cross(sys, LAB.g1, LAB.g2), order = phenoList(sys).filter(p => X.pc[p]), tot = X.cells.length;
  const minP = Math.min(...order.map(p => cnt[p] || 0)) || 1;
  $('#simout').innerHTML = `<div class="bars">${order.map(p => { const c = cnt[p] || 0; return `<div class="row"><span>${p}</span><div class="meter"><i style="width:${100 * c / n}%"></i></div><span style="text-align:right">${c}</span></div>`; }).join('')}</div>
    <p style="margin-top:8px">Beobachtet: <b>${order.map(p => ((cnt[p] || 0) / minP).toFixed(2).replace('.', ',')).join(' : ')}</b><br>Erwartet: <b>${ratio(X.pc, order)}</b> (${order.map(p => Math.round(100 * X.pc[p] / tot) + ' %').join(' / ')})</p>
    <p class="muted" style="font-size:.9rem;margin-top:6px">Wiederhole die Simulation mehrmals: Bei 10 Nachkommen schwanken die Zahlen stark, bei 8000 kaum noch.</p>`;
}

function taskText(k, W) {

      if (k === 'luecke') h += '<p>' + LUECKE.map((it, j) => `${j + 1}. ${it[1]}`).join(' · ') + '</p>';
    });
    h += '</section>';
  }
  h += `<div class="pfoot">Mendelsche Regeln · ${LVN[lv]} · Weiter mit: Stammbaumanalyse (makro5652.github.io/animationen/stammbaum-selbstlernkurs.html)</div>`;
  $('#print').innerHTML = h;
}

/* ================= Start ================= */
function init() {
  $('nav.tabs').innerHTML = TABS.map(([k, n], i) => `<button role="tab" data-tab="${k}">${i ? `<span class="n">${i}</span>` : ''}${n}</button>`).join('') + '<a class="navlink" href="stammbaum-selbstlernkurs.html">Weiter: Stammbaumanalyse →</a>';
  $$('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
  $$('.levels button').forEach(b => b.onclick = () => setLevel(b.dataset.lv));
  $('#wsbtn').onclick = () => { $('#drawer .body').innerHTML = `<h2>Wortspeicher</h2><dl class="ws">${WS_GLOSS.map(g => `<dt>${g[0]} <span>· ${g[1]}</span></dt><dd>${g[2]}</dd>`).join('')}</dl>`; $('#drawer').classList.add('open'); };
  $$('#drawer .scrim, #drawer .close').forEach(x => x.onclick = () => $('#drawer').classList.remove('open'));
  $('#reset').onclick = () => { if (confirm('Alle Punkte und Fortschritte auf diesem Gerät löschen?')) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } };
  if (S.level !== 'R' && S.level !== 'G') S.level = 'R';
  updateHeader(); render();
}
init();

</script>
