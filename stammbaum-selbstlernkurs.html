<script>
/* ================= Engine: Erbgänge, Genotypen, Konsistenzprüfung ================= */
const MODES = {
  AD: { name: 'autosomal-dominant',        type: 'auto', dom: true },
  AR: { name: 'autosomal-rezessiv',        type: 'auto', dom: false },
  XD: { name: 'X-chromosomal-dominant',    type: 'X',    dom: true },
  XR: { name: 'X-chromosomal-rezessiv',    type: 'X',    dom: false },
  Y:  { name: 'Y-chromosomal',             type: 'Y' },
  MT: { name: 'mitochondrial',             type: 'MT' }
};
const MODES_BY_LEVEL = { R: ['AD', 'AR', 'XR'], G: ['AD', 'AR', 'XD', 'XR'], O: ['AD', 'AR', 'XD', 'XR', 'Y', 'MT'] };

function genosFor(mode, sex) {
  const t = MODES[mode].type;
  if (t === 'auto') return ['AA', 'Aa', 'aa'];
  if (t === 'X') {
    const f = ['XAXA', 'XAXa', 'XaXa'], m = ['XAY', 'XaY'];
    return sex === 'f' ? f : sex === 'm' ? m : f.concat(m);
  }
  if (t === 'Y') return sex === 'f' ? ['XX'] : sex === 'm' ? ['XY*', 'XY'] : ['XX', 'XY*', 'XY'];
  return ['M', 'N']; // MT: M = veränderte mtDNA, N = unveränderte mtDNA
}
function isAffected(mode, g) {
  switch (mode) {
    case 'AD': return g.indexOf('A') >= 0;
    case 'AR': return g === 'aa';
    case 'XD': return g.indexOf('XA') >= 0;
    case 'XR': return g === 'XaXa' || g === 'XaY';
    case 'Y':  return g === 'XY*';
    case 'MT': return g === 'M';
  }
}
function normAuto(a, b) { return (a === 'A' ? 'A' + b : b === 'A' ? 'A' + a : a + b); }
function normX(a, b) { return (a === 'XA' ? a + b : b === 'XA' ? b + a : a + b); }
function xParts(g) { return g.endsWith('Y') ? [g.slice(0, 2), 'Y'] : [g.slice(0, 2), g.slice(2, 4)]; }

/* Kann das Kind gc aus Vater gf und Mutter gm hervorgehen? */
function canChild(mode, gf, gm, gc) {
  const t = MODES[mode].type;
  if (t === 'MT') return gc === gm;
  if (t === 'auto') {
    for (const a of gf) for (const b of gm) if (normAuto(a, b) === gc) return true;
    return false;
  }
  if (t === 'X') {
    const fx = xParts(gf)[0], mx = xParts(gm);
    if (gc.endsWith('Y')) return mx.some(x => x + 'Y' === gc);
    return mx.some(x => normX(fx, x) === gc);
  }
  if (t === 'Y') {
    if (gc === 'XX') return true;
    return gc === gf;
  }
}

function personMap(ped) { const m = {}; ped.people.forEach(p => m[p.id] = p); return m; }
function parentsOf(ped) {
  const r = {}, pm = personMap(ped);
  ped.fam.forEach(f => {
    if (!f.p) return;
    const [a, b] = f.p.map(id => pm[id]);
    const father = a.sex === 'm' ? a : b, mother = a.sex === 'm' ? b : a;
    f.c.forEach(c => r[c] = { father: father.id, mother: mother.id });
  });
  return r;
}
function topoOrder(ped) {
  const par = parentsOf(ped), done = new Set(), out = [];
  const visit = id => {
    if (done.has(id)) return; done.add(id);
    if (par[id]) { visit(par[id].father); visit(par[id].mother); }
    out.push(id);
  };
  ped.people.forEach(p => visit(p.id));
  return out;
}

/* Alle Lösungen aufzählen: ok + mögliche Genotypen je Person */
function solve(ped, mode, fixed) {
  fixed = fixed || {};
  const pm = personMap(ped), par = parentsOf(ped), order = topoOrder(ped);
  const opts = {};
  for (const id of order) {
    const p = pm[id];
    opts[id] = genosFor(mode, p.sex).filter(g => isAffected(mode, g) === !!p.aff && (!fixed[id] || fixed[id].indexOf(g) >= 0));
  }
  const possible = {}; order.forEach(id => possible[id] = new Set());
  const cur = {}; let count = 0, nodes = 0;
  const rec = i => {
    if (++nodes > 3e6) return;
    if (i === order.length) {
      count++; order.forEach(id => possible[id].add(cur[id])); return;
    }
    const id = order[i], pr = par[id];
    for (const g of opts[id]) {
      if (pr && !canChild(mode, cur[pr.father], cur[pr.mother], g)) continue;
      cur[id] = g; rec(i + 1);
    }
  };
  rec(0);
  const poss = {}; order.forEach(id => poss[id] = genosFor(mode, pm[id].sex).filter(g => possible[id].has(g)));
  return { ok: count > 0, count, possible: poss };
}
function consistentModes(ped, modes, fixedByMode) {
  return modes.filter(m => solve(ped, m, fixedByMode && fixedByMode[m]).ok);

function shuffle(a, r) { a = a.slice(); r = r || Math.random; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ================= Kombinationsquadrat ================= */
function punnett(el, mode) {
  const t = MODES[mode].type;

  const defF = { AD: 'Aa', AR: 'Aa', XD: 'XAY', XR: 'XAY', Y: 'XY*', MT: 'N' }[mode], defM = { AD: 'aa', AR: 'Aa', XD: 'XaXa', XR: 'XAXa', Y: 'XX', MT: 'M' }[mode];
  el.innerHTML = `<div class="qtitle">Kombinationsquadrat</div><p class="muted" style="font-size:.92rem">Wähle die Genotypen der Eltern. Jede Zelle ist gleich wahrscheinlich.</p>
    <div class="btnrow" style="margin:8px 0"><label>Vater <select class="sel pf">${fo.map(g => `<option ${g === defF ? 'selected' : ''}>${g}</option>`).join('')}</select></label>
    <label>Mutter <select class="sel pmo">${mo.map(g => `<option ${g === defM ? 'selected' : ''}>${g}</option>`).join('')}</select></label></div><div class="pout"></div>`;
  const draw = () => {
    const gf = $('.pf', el).value, gm = $('.pmo', el).value;
    let fg, mg;
    if (t === 'auto') { fg = gf.split(''); mg = gm.split(''); }
    else if (t === 'X') { fg = gf.endsWith('Y') ? [gf.slice(0, 2), 'Y'] : [gf.slice(0, 2), gf.slice(2)]; mg = [gm.slice(0, 2), gm.slice(2)]; }
    else if (t === 'Y') { fg = ['X', gf.slice(1)]; mg = ['X', 'X']; }
    else { fg = ['–', '–']; mg = [gm, gm]; }
    const kid = (a, b) => {
      if (t === 'auto') return (a === 'A' ? a + b : b === 'A' ? b + a : a + b);
      if (t === 'X') return b === 'Y' ? a + 'Y' : (a === 'XA' ? a + b : b === 'XA' ? b + a : a + b);
      if (t === 'Y') return 'X' + b;
      return a;
    };
    let rows = '', n = 0, nA = 0, sons = 0, sonsA = 0, dau = 0, dauA = 0;
    mg.forEach(m => {
      rows += `<tr><th>${genoHTML(m)}</th>`;
      fg.forEach(f => {
        const k = t === 'MT' ? m : kid(m, f), aff = isAffected(mode, k); n++; if (aff) nA++;
        const male = /Y/.test(k); if (t !== 'auto' && t !== 'MT') { if (male) { sons++; if (aff) sonsA++; } else { dau++; if (aff) dauA++; } }
        const car = !aff && ((mode === 'AR' && k === 'Aa') || (mode === 'XR' && k === 'XAXa'));
        rows += `<td class="${aff ? 'aff' : car ? 'car' : ''}">${genoHTML(k === 'XY' ? 'XY' : k)}</td>`;
      });
      rows += '</tr>';
    });
    const pc = (a, b) => b ? Math.round(100 * a / b) + ' %' : '–';
    $('.pout', el).innerHTML = `<table class="punnett"><tr><th style="font-size:.8rem">♀ \\ ♂</th>${fg.map(f => `<th>${genoHTML(f)}</th>`).join('')}</tr>${rows}</table>
      <p style="font-size:.95rem">Kinder mit Merkmal: <b>${pc(nA, n)}</b>${t === 'X' || t === 'Y' ? ` · Söhne: <b>${pc(sonsA, sons)}</b> · Töchter: <b>${pc(dauA, dau)}</b>` : ''}</p>
      <div class="legend"><span><span style="display:inline-block;width:14px;height:14px;background:var(--aff);border-radius:3px;vertical-align:middle"></span> mit Merkmal</span>${mode === 'AR' || mode === 'XR' ? '<span><span style="display:inline-block;width:14px;height:14px;background:var(--hl-soft);border:1px solid var(--line);border-radius:3px;vertical-align:middle"></span> Überträger/in (heterozygot)</span>' : ''}</div>`;
  };
  $('.pf', el).onchange = draw; $('.pmo', el).onchange = draw; draw();
}

/* ---------- M1 Grundlagen ---------- */
function pgM1(m) {
  const lv = S.level;
  m.innerHTML = `<div class="section-head"><div class="eyebrow">M1 · Grundlagen der Stammbaumanalyse</div><h2>Einen Stammbaum lesen</h2>
    <p>Wenn bestimmte Merkmale oder Krankheiten in einer Familie gehäuft auftreten, liegt die Vermutung nahe, dass sie vererbt werden. Mit einer Stammbaumanalyse kann man das untersuchen.</p></div>
    <div class="grid2">
      <div class="card"><h3>Was ist eine Stammbaumanalyse?</h3>
        <p>Die Stammbaumanalyse ist eine der wichtigsten Methoden, um Erbgänge beim Menschen zu untersuchen. Man hält fest, welche Personen einer Familie wie miteinander verwandt sind, welches Geschlecht sie haben und ob sie ein Merkmal zeigen (<b>Merkmalsträger</b>) oder nicht.</p>
        <p>${lv === 'O' ? 'Weil beim Menschen keine gezielten Kreuzungen möglich sind und die Nachkommenzahlen klein sind, ersetzt die Stammbaumanalyse das Kreuzungsexperiment. Aussagen sind deshalb entweder <b>sicher</b> (Ausschluss durch eine Konstellation) oder nur <b>wahrscheinlich</b>.' : 'Beim Menschen kann man keine Kreuzungsversuche machen. Deshalb schaut man sich Familien über mehrere Generationen an.'}</p>
        <div class="warn" style="margin-top:10px"><b>Wichtig:</b> „Normal“ oder „ohne Merkmal“ bedeutet hier nur: Die Krankheit ist <b>nicht ausgeprägt</b>. Die Person kann trotzdem ein Krankheitsallel tragen.</div></div>
      <div class="card"><h3>Die Symbole</h3><p class="muted" style="font-size:.92rem">Tippe auf ein Symbol.</p>
        <div class="btnrow" id="symbtns" style="margin-top:8px">${[['m', 0], ['f', 0], ['u', 0], ['m', 1], ['f', 1], ['u', 1]].map(([s, a]) => `<button class="chip" data-s="${s}" data-a="${a}" aria-pressed="false" style="padding:6px 10px">${symMini(s, a)}</button>`).join('')}
          <button class="chip" data-line="p" aria-pressed="false">Partnerlinie</button><button class="chip" data-line="g" aria-pressed="false">Geschwisterlinie</button></div>
        <div class="fb show info" id="syminfo" style="display:block">Quadrat = Mann · Kreis = Frau · Raute = Geschlecht nicht angegeben. Ausgefüllt = Merkmalsträger.</div></div>

    <div class="card" style="margin-top:16px"><h3>Generationen und Verwandtschaft</h3>

    <div class="card" style="margin-top:16px"><h3>Übung 1 · Symbolik: richtig oder falsch?</h3><p class="muted" style="font-size:.92rem">Entscheide für jede Darstellung. Bei „falsch“ erscheint die Verbesserung.</p><div id="tf"></div></div>
    <div class="card" style="margin-top:16px"><h3>Übung 2 · Welcher Stammbaum passt?</h3><div id="u2"></div></div>
    <div class="card" style="margin-top:16px"><h3>Übung 3 · Familiengeschichte aus Sicht der markierten Person</h3>
      <div class="wiz"><div><div class="pedwrap" id="u3ped"></div>${legendHTML(PEDS.m1u3)}<p class="muted" style="font-size:.88rem;margin-top:4px">Der Pfeil markiert die Person, aus deren Sicht erzählt wird.</p></div><div id="u3"></div></div></div>
    <div class="card" style="margin-top:16px"><h3>Übung 4 · Für Profis</h3><div id="u4"></div></div>`;
  // Symbole
  const info = { m0: 'Quadrat, leer: <b>Mann ohne Merkmal</b>.', f0: 'Kreis, leer: <b>Frau ohne Merkmal</b>.', u0: 'Raute, leer: <b>Person ohne Merkmal, Geschlecht nicht angegeben</b> (unbekannt oder für die Aufgabe unwichtig).',
    m1: 'Quadrat, ausgefüllt: <b>Mann mit Merkmal</b> (Merkmalsträger).', f1: 'Kreis, ausgefüllt: <b>Frau mit Merkmal</b> (Merkmalsträgerin).', u1: 'Raute, ausgefüllt: <b>Person mit Merkmal</b>, Geschlecht nicht angegeben.',
    p: '<b>Partnerlinie:</b> Eine waagerechte Linie direkt zwischen Frau und Mann verbindet ein Paar. Von ihrer Mitte führt eine senkrechte Linie zu den Kindern.' + (lv === 'O' ? ' Eine Doppellinie kennzeichnet eine Verwandtenehe (Konsanguinität).' : ''),
    g: '<b>Geschwisterlinie:</b> Eine waagerechte Linie <i>über</i> mehreren Personen, von der kurze Linien nach unten zu jedem Kind führen. Alle Personen daran sind Geschwister.' };
  $$('#symbtns .chip').forEach(b => b.onclick = () => { $$('#symbtns .chip').forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); $('#syminfo').innerHTML = info[b.dataset.line || (b.dataset.s + b.dataset.a)]; });
  // Generationen
  let gsel = null;
  const drawGen = () => { $('#genped').innerHTML = renderPed(PEDS.m1gen, { tap: true, rings: gsel ? { [gsel]: 'sel' } : {} }); };
  drawGen(); bindTap($('#genped'), id => { gsel = id; drawGen(); $('#geninfo').innerHTML = describe(PEDS.m1gen, id); });
  m1Assign($('#assign'));
  pedChoice($('#ext'), {
    text: 'Ergänze den Stammbaum aus Aufgabe 1 um eine weitere Tochtergeneration: Die <b>normale Tochter</b> hat mit ihrem <b>merkmalstragenden Mann</b> zwei Kinder. Das Geschlecht der Kinder ist nicht bekannt; nur eines der Kinder ist Merkmalsträger. Welcher Stammbaum ist richtig?',
    key: 'm1:ext', pts: 3,
    options: [
      { ok: true, ped: PEDS.m1a3 },
      { ok: false, ped: { people: PEDS.m1a3.people.map(p => p.id === 6 ? Object.assign({}, p, { aff: false }) : p), fam: PEDS.m1a3.fam }, why: 'Der Mann der Tochter zeigt hier kein Merkmal.' },
      { ok: false, ped: { people: PEDS.m1a3.people.map(p => p.id === 8 ? Object.assign({}, p, { aff: true }) : p), fam: PEDS.m1a3.fam }, why: 'Hier sind beide Kinder Merkmalsträger.' },
      { ok: false, ped: { people: PEDS.m1a3.people.map(p => p.id === 5 ? Object.assign({}, p, { aff: true }) : p.id === 6 ? Object.assign({}, p, { aff: false }) : p), fam: PEDS.m1a3.fam }, why: 'Hier ist die Tochter Merkmalsträgerin, ihr Mann nicht – vertauscht.' }
    ]
  });
  // Übung 1
  $('#tf').innerHTML = M1U1.map((it, i) => `<div class="tfrow" data-i="${i}"><div class="pedwrap" style="padding:4px">${renderPed(it.ped, { nums: false, maxW: 150 })}</div><div><b>${'abcdefg'[i]})</b> → ${it.claim}<div class="fb"></div></div><div class="btnrow"><button class="chip" data-v="1">richtig</button><button class="chip" data-v="0">falsch</button></div></div>`).join('');
  $$('#tf .tfrow').forEach(row => {
    const it = M1U1[+row.dataset.i];
    $$('.chip', row).forEach(b => b.onclick = () => {

  $('#u3ped').innerHTML = renderPed(PEDS.m1u3, {});
  $('#u3').innerHTML = M1U3.map((it, i) => `<div class="tfrow" style="grid-template-columns:minmax(0,1fr) auto" data-i="${i}"><div>${it.s}<div class="fb"></div></div><div class="btnrow"><button class="chip" data-v="1">stimmt</button><button class="chip" data-v="0">stimmt nicht</button></div></div>`).join('');
  $$('#u3 .tfrow').forEach(row => {
    const it = M1U3[+row.dataset.i];
    $$('.chip', row).forEach(b => b.onclick = () => {
      if (row.dataset.locked) return; row.dataset.locked = 1;
      const right = (b.dataset.v === '1') === it.ok; b.classList.add(right ? 'ok' : 'bad'); if (right) award('m1:u3' + row.dataset.i, 1);
      const fb = $('.fb', row); fb.className = 'fb show ' + (right ? 'ok' : 'bad'); fb.innerHTML = (right ? 'Richtig. ' : 'Falsch. ') + (it.why || (it.ok ? 'Die Aussage stimmt.' : ''));
    });
  });
  pedChoice($('#u4'), { text: M1U4.text, options: M1U4.options, multi: true, key: 'm1:u4', pts: 4,
    ex: ' Es gibt zwei Lösungen: 2 Töchter + 3 Söhne oder 3 Töchter + 2 Söhne – jeweils sind alle Töchter und alle Söhne bis auf einen betroffen.' + (lv !== 'R' ? ' <i>Zusatz:</i> Gesunde Eltern mit kranken Kindern → rezessiv; kranke Töchter mit gesundem Vater → nicht X-chromosomal. Der Erbgang ist autosomal-rezessiv.' : '') });
}
function m1Assign(el) {
  const ped = PEDS.m1a;
  const terms = ['normale männliche Person', 'Tochtergeneration', 'weibliche Merkmalsträgerin', 'Elterngeneration', 'männlicher Merkmalsträger', 'normale weibliche Person'];
  const sol = { 1: 'weibliche Merkmalsträgerin', 2: 'männlicher Merkmalsträger', 3: 'weibliche Merkmalsträgerin', 4: 'normale männliche Person', 5: 'normale weibliche Person', g0: 'Elterngeneration', g1: 'Tochtergeneration' };
  const asg = {}; let term = null, checked = false;
  const draw = () => {
    const labels = {}, cls = {};
    [1, 2, 3, 4, 5].forEach(id => { labels[id] = asg[id] ? esc(asg[id].replace('normale ', 'norm. ').replace('weibliche Merkmalsträgerin', 'weibl. MT').replace('männlicher Merkmalsträger', 'männl. MT').replace('männliche Person', 'männl.').replace('weibliche Person', 'weibl.')) : '?'; cls[id] = checked ? (asg[id] === sol[id] ? 'ok' : 'bad') : asg[id] ? '' : 'q'; });
    el.innerHTML = `<p>Tippe zuerst einen Begriff an, dann die passende Person oder Reihe. Begriffe dürfen mehrfach verwendet werden.</p>
      <div class="btnrow" style="margin:10px 0">${terms.map(t => `<button class="chip" data-t="${t}" aria-pressed="${t === term}">${t}</button>`).join('')}</div>
      <div class="btnrow" style="margin-bottom:8px">${['g0', 'g1'].map((g, i) => `<button class="btn ${checked ? (asg[g] === sol[g] ? 'ok' : 'bad') : ''}" data-g="${g}" style="${checked ? `border-color:var(--${asg[g] === sol[g] ? 'ok' : 'bad'})` : ''}">${i ? 'Untere Reihe (3–5)' : 'Obere Reihe (1, 2)'}: <b>${asg[g] || '?'}</b></button>`).join('')}</div>
      <div class="pedwrap grid-bg">${renderPed(ped, { tap: !checked, labels, labelCls: cls, maxW: 520 })}</div>
      <p class="muted" style="font-size:.86rem;margin-top:4px">Abkürzungen im Bild: MT = Merkmalsträger/in, norm. = normal</p>
      <div class="btnrow" style="margin-top:10px">${checked ? '<button class="btn again">Neu beginnen</button>' : `<button class="btn primary chk" ${Object.keys(asg).length < 7 ? 'disabled' : ''}>Prüfen</button>`}</div><div class="fb"></div>`;
    $$('[data-t]', el).forEach(b => b.onclick = () => { term = b.dataset.t; draw(); });
    $$('[data-g]', el).forEach(b => b.onclick = () => { if (checked) return; if (!term) { toast('Erst einen Begriff wählen'); return; } asg[b.dataset.g] = term; draw(); });
    bindTap($('.pedwrap', el), id => { if (checked) return; if (!term) { toast('Erst einen Begriff wählen'); return; } asg[id] = term; draw(); });
    const c = $('.chk', el); if (c) c.onclick = () => {
      checked = true; const keys = Object.keys(sol), ok = keys.filter(k => asg[k] === sol[k]).length;
      if (ok === keys.length) award('m1:assign', 4); draw();
      const fb = $('.fb', el); fb.className = 'fb show ' + (ok === keys.length ? 'ok' : 'bad');
      fb.innerHTML = `<b class="v">${ok} von ${keys.length} richtig.</b>Lösung: 1 weibliche Merkmalsträgerin, 2 männlicher Merkmalsträger, 3 weibliche Merkmalsträgerin, 4 normale männliche Person, 5 normale weibliche Person; oben Elterngeneration, unten Tochtergeneration.`;
    };
    const a = $('.again', el); if (a) a.onclick = () => { checked = false; Object.keys(asg).forEach(k => delete asg[k]); draw(); };
  };
  draw();
}

/* ---------- Erbgänge ---------- */
let modeSel = null;
function pgModes(m) {
  const lv = S.level, list = MODES_BY_LEVEL[lv];
  if (list.indexOf(modeSel) < 0) modeSel = list[0];
  const mi = MODE_INFO[modeSel], ped = PEDS[mi.ped];
  const def = mi.def[lv] || mi.def.O;
  m.innerHTML = `<div class="section-head"><div class="eyebrow">M2–M4 · Erbgangstypen</div><h2>Die Erbgänge im Überblick</h2>
    <p>Bei der Vererbung von Krankheiten unterscheidet man, ob das krankheitsverursachende Allel <b>dominant</b> oder <b>rezessiv</b> ist und ob das Gen auf einem <b>Autosom</b> (Körperchromosom) oder einem <b>Gonosom</b> (Geschlechtschromosom X oder Y) liegt.</p></div>
    <div class="subtabs">${list.map(k => `<button data-m="${k}" aria-selected="${k === modeSel}">${modeName(k)}</button>`).join('')}</div>
    <div class="grid2">
      <div class="card"><h3>${modeName(modeSel)}</h3><p>${def}</p><p class="muted" style="margin-top:8px;font-size:.95rem">${mi.alleles}</p>
        <h4 style="margin-top:14px">Typische Hinweise im Stammbaum</h4><ul class="clean">${mi.hints.map(h => `<li>${h}</li>`).join('')}</ul>
        <h4 style="margin-top:14px">Sichere Aussagen</h4>${mi.proof.map(p => `<div class="proof" style="margin-top:8px">${p}</div>`).join('')}</div>
      <div class="card"><h3>Typischer Stammbaum</h3>
        <div class="pedwrap" id="mped" style="margin-top:6px"></div>${legendHTML(ped)}
        <div class="btnrow" style="margin-top:10px"><button class="btn" id="gtog">Genotypen zeigen</button>${modeSel === 'AR' || modeSel === 'XR' ? '<button class="btn" id="ctog">Überträger markieren</button>' : ''}</div>
        <div id="meval" style="margin-top:12px"></div></div>
    </div>
    ${mi.disease ? `<div class="card" style="margin-top:16px"><h3>Beispiel: ${mi.disease.name}</h3><table class="t" style="margin-top:8px"><tr><th>Ursache</th><td>${mi.disease.cause}</td></tr><tr><th>Häufigkeit</th><td>${mi.disease.freq}</td></tr><tr><th>Symptome</th><td>${mi.disease.sympt}</td></tr><tr><th>Therapie</th><td>${mi.disease.ther}</td></tr></table><p class="muted" style="margin-top:8px;font-size:.95rem">${mi.more}</p></div>` : ''}
    <div class="grid2" style="margin-top:16px"><div class="card" id="pun"></div><div class="card"><h3>Selbst prüfen</h3><div id="mq"></div></div></div>
    <div class="card" style="margin-top:16px"><h3>Aufgabe · Genotypen im typischen Stammbaum</h3><div class="wiz" style="margin-top:8px"><div><div class="pedwrap" id="gped"></div></div><div id="gpanel"></div></div></div>`;
  $$('.subtabs button', m).forEach(b => b.onclick = () => { modeSel = b.dataset.m; pgModes(m); });
  let showG = false, showC = false;
  const sol = solve(ped, modeSel);
  const drawM = () => {
    const labels = showG ? Object.fromEntries(ped.people.map(p => [p.id, sol.possible[p.id].map(genoSVG).join(' / ')])) : null;
    const carriers = showC ? new Set(ped.people.filter(p => sol.possible[p.id].length === 1 && ['Aa', 'XAXa'].indexOf(sol.possible[p.id][0]) >= 0 && !p.aff).map(p => p.id)) : null;
    $('#mped').innerHTML = renderPed(ped, { labels, carriers });
  };
  drawM();
  $('#gtog').onclick = e => { showG = !showG; e.target.textContent = showG ? 'Genotypen ausblenden' : 'Genotypen zeigen'; drawM(); };
  if ($('#ctog')) $('#ctog').onclick = e => { showC = !showC; e.target.textContent = showC ? 'Markierung aus' : 'Überträger markieren'; drawM(); };
  // Bewertung des typischen Stammbaums
  const cons = consistentModes(ped, list), ev = evidence(ped);
  const proofT = ev.filter(e => e.t === 'nnA' || e.t === 'aaN')[0];
  let evh = '';
  if (lv === 'R') {
    evh = `<div class="${proofT ? 'proof' : 'warn'}"><b>${proofT ? 'Was dieser Stammbaum sicher zeigt:' : 'Achtung:'}</b> ${proofT ? EV_TEXT[proofT.t] : 'Dieser Stammbaum ist <i>typisch</i>, aber er beweist den Erbgang nicht. Es gibt weder gesunde Eltern mit krankem Kind noch kranke Eltern mit gesundem Kind.'}</div>`;
  } else {
    evh = `<div class="${cons.length === 1 ? 'proof' : 'warn'}"><b>Kritischer Blick: Was beweist dieser Stammbaum?</b><br>Mit diesem Stammbaum allein sind vereinbar: <b>${cons.map(modeName).join(', ')}</b>.${cons.length > 1 ? ' Er zeigt also ein <i>typisches Muster</i>, beweist den Erbgang aber nicht.' : ' Der Erbgang ist eindeutig.'}</div>
      <details style="margin-top:8px"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center">Begründung anzeigen</summary><ul class="clean">${list.filter(k => cons.indexOf(k) < 0).map(k => { const e = ev.find(x => x.ex.indexOf(k) >= 0); return `<li><b>${modeName(k)} ausgeschlossen:</b> ${e ? EV_TEXT[e.t] + ' (Personen ' + e.ids.map(i => pedById(ped, i).n).join(', ') + ')' : 'durch Genotypenanalyse.'}</li>`; }).join('')}</ul></details>`;
  }
  $('#meval').innerHTML = evh;

    stat[i] = ok ? 'done' : 'miss'; st.done = true;
    const fb = $('#wfb', root); fb.className = 'fb show ' + (cls || (ok ? 'ok' : 'bad')); fb.innerHTML = txt;
    $('#wnext', root).hidden = false; drawPed();
  };
  const showStep = () => {
    st = { tries: 0 }; rings = {}; gt = null;
    root.innerHTML = html(); drawPed();
    const s = steps[i], q = $('#wq', root);
    bindTap($('#wped', root), id => onTap(id));
    const nextBtn = '<div class="btnrow" style="margin-top:10px"><button class="btn primary" id="wnext" hidden>Weiter</button></div>';
    if (s.kind === 'info') { q.innerHTML = s.html + '<div class="btnrow" style="margin-top:12px"><button class="btn primary" id="wgo">Analyse starten</button></div>'; $('#wgo', root).onclick = () => { stat[i] = 'done'; i++; showStep(); }; return; }
    if (s.kind === 'yn') {
      q.innerHTML = `<p>${s.q}</p><div class="btnrow" style="margin-top:10px"><button class="btn" data-yn="1">${s.yesL ? 'Ja, ' + s.yesL : 'Ja'}</button><button class="btn" data-yn="0">${s.noL ? 'Nein, ' + s.noL : 'Nein'}</button></div><div id="wtap"></div><div class="fb" id="wfb"></div>${nextBtn}`;
      $$('[data-yn]', q).forEach(b => b.onclick = () => {
        if (st.done || st.tap) return;
        const ans = b.dataset.yn === '1';
        if (ans === s.yes) {
          if (s.yes && !s.noTap) { st.tap = true; $$('[data-yn]', q).forEach(x => x.disabled = true); b.classList.add('ok'); $('#wtap', root).innerHTML = `<div class="tapprompt">${s.tapQ}</div>`; return; }
          b.classList.add('ok');
          let txt = s.yes ? (s.yesText || '') : s.noText;
          if (!s.yes && s.noEv) { const e = ev.find(x => s.noEv.indexOf(x.t) >= 0); if (e) { e.ids.forEach(id => rings[id] = 'hl'); txt = 'Richtig. ' + EV_TEXT[e.t]; } }
          if (st.tries === 0) award2(s.id, 2);
          finish(true, `<b class="v">Richtig.</b>${txt.replace(/^Richtig[.:] ?/, '')}`);
        } else {
          st.tries++; b.classList.add('bad');
          if (st.tries >= 2) { reveal(s); return; }
          const fb = $('#wfb', root); fb.className = 'fb show bad'; fb.innerHTML = `<b class="v">Falsch.</b>${s.hint || 'Schau noch einmal genau hin.'}`;
          setTimeout(() => b.classList.remove('bad'), 900);
        }
      });
    }
    if (s.kind === 'mc') {
      q.innerHTML = '<div id="wmc"></div><div class="fb" id="wfb" style="display:none"></div>' + nextBtn;
      mcBlock($('#wmc', root), { q: s.q, opts: s.opts, a: s.a, multi: s.multi, ex: s.ex, noShuffle: s.noShuffle, key: K + s.id, pts: 2,
        onDone: (right, tries, pts) => { if (tries === 1) { stat[i] = right ? 'done' : 'miss'; runPts += pts || 0; } $('#wnext', root).hidden = false; } });
    }
    if (s.kind === 'geno') {
      q.innerHTML = (s.note ? `<div class="note" style="margin-bottom:10px">${s.note}</div>` : '') + '<div id="wg"></div>' + nextBtn;
      gt = GenoTask({ ped, mode: s.mode, fixed: cfg.fixed && cfg.fixed[s.mode], key: K + 'geno', redraw: () => { drawPed(); gt.panel($('#wg', root)); }, onDone: (ok, n) => { stat[i] = ok === n ? 'done' : 'miss'; runPts += ok; $('#wnext', root).hidden = false; } });
      drawPed(); gt.panel($('#wg', root));
    }
    if (s.kind === 'end') {
      const good = stat.filter(x => x === 'done').length;
      q.innerHTML = `<p>Du hast <b>${good} von ${steps.length - 1}</b> Schritten auf Anhieb richtig gelöst.</p><p style="margin-top:6px">In diesem Durchgang neu erhalten: <b>${runPts} Punkte</b>.</p>
        <div class="merke" style="margin-top:12px"><b class="t">Ergebnis</b>${cons.length === 1 ? `Der Stammbaum beweist: <b>${modeName(cons[0])}</b>.` : `Vereinbar sind: <b>${cons.map(modeName).join(', ')}</b>.`}${cfg.given ? ` Mit der Zusatzinformation: <b>${modeName(cfg.final)}</b>.` : ''}</div>
        <div class="btnrow" style="margin-top:12px"><button class="btn primary" id="wnc">Nächster Fall</button><button class="btn" id="wre">Fall wiederholen</button></div>`;
      $('#wre', root).onclick = () => { i = 0; stat.fill(''); runPts = 0; showStep(); };
      $('#wnc', root).onclick = () => { const list = CASES.filter(c => c.levels.indexOf(lv) >= 0); const k = list.findIndex(c => c.id === cfg.id); caseSel = list[(k + 1) % list.length].id; render(); };
    }
    const nb = $('#wnext', root); if (nb) nb.onclick = () => { i++; showStep(); window.scrollTo({ top: root.offsetTop - 120, behavior: 'smooth' }); };
  };
  const reveal = s => {
    let txt = '';
    if (s.yes && !s.noTap) { const e = ev.find(x => s.tapOk(x.key)); if (e) { e.ids.forEach(id => rings[id] = 'hl'); txt = EV_TEXT[e.t] + ` (markiert: Personen ${e.ids.map(id => pedById(ped, id).n).join(', ')})`; } }
    else if (s.yes) txt = s.yesText || 'Die Antwort ist „Ja“.';
    else { txt = s.noText; if (s.noEv) { const e = ev.find(x => s.noEv.indexOf(x.t) >= 0); if (e) { e.ids.forEach(id => rings[id] = 'hl'); txt = EV_TEXT[e.t]; } } }
    finish(false, `<b class="v">Lösung:</b>${txt}`, 'info');
  };
  const onTap = id => {
    const s = steps[i];
    if (gt) { gt.onTap(id); return; }
    if (s.kind === 'yn' && st.tap && !st.done) {
      const e = s.tapOk(id);
      if (e) { e.ids.forEach(x => rings[x] = 'hl'); if (st.tries === 0) award2(s.id, 2); finish(st.tries === 0, `<b class="v">Richtig – ${pLabel(ped, id)}.</b>${EV_TEXT[e.t]}`); }
      else {
        st.tries++; rings = { [id]: 'bad' }; drawPed();
        if (st.tries >= 3) { rings = {}; reveal(s); return; }
        const fb = $('#wfb', root); fb.className = 'fb show bad'; fb.innerHTML = `<b class="v">Falsch – ${pLabel(ped, id)} passt nicht.</b>${s.hint || ''}`;
      }
      return;
    }
    rings = { [id]: 'sel' }; drawPed();
    const inf = $('#winfo', root); inf.className = 'fb show info'; inf.innerHTML = describe(ped, id);
  };
  showStep();
}

/* ---------- Training ---------- */
let trainPed = null, trainSeed = 0;
function pgTrain(m) {
  const lv = S.level, modes = MODES_BY_LEVEL[lv];
  if (!trainPed || trainPed.level !== lv) newTrain();
  const ped = trainPed, cons = ped.consistent;
  m.innerHTML = `<div class="section-head"><div class="eyebrow">Training · unbegrenzt</div><h2>Zufällige Stammbäume analysieren</h2>
    <p>Jeder Stammbaum wird nach den Vererbungsregeln zufällig erzeugt. Analysiere ihn mit dem Prüfschema. Für jede richtige Antwort beim ersten Versuch gibt es Punkte.</p></div>
    <div class="wiz"><div class="card" style="padding:12px"><div class="pedwrap" id="tped"></div>${legendHTML(ped)}<p class="muted" style="font-size:.88rem;margin-top:6px">Bisher: ${S.train.ok} von ${S.train.n} Stammbäumen vollständig richtig.</p></div>
    <div class="side card"><div id="tq1"></div><div id="tq2" style="margin-top:14px"></div><div id="tsol"></div><div class="btnrow" style="margin-top:12px"><button class="btn" id="tnew">Neuer Stammbaum</button></div></div></div>`;
  let rings = {};
  const draw = () => { $('#tped').innerHTML = renderPed(ped, { rings, tap: true }); };
  draw(); bindTap($('#tped'), id => { rings = { [id]: 'sel' }; draw(); });
  $('#tnew').onclick = () => { newTrain(); pgTrain(m); };
  const ev = evidence(ped); let res = [];
  const sol = () => {
    S.train.n++; if (res.every(Boolean)) S.train.ok++; save();
    $('#tsol').innerHTML = `<div class="merke" style="margin-top:14px"><b class="t">Begründung</b><ul class="clean">${modes.map(k => { if (cons.indexOf(k) >= 0) return `<li><b>${modeName(k)}</b>: möglich</li>`; const e = ev.find(x => x.ex.indexOf(k) >= 0); return `<li><b>${modeName(k)}</b>: ausgeschlossen ${e ? `<button class="chip" data-ev="${ev.indexOf(e)}" style="min-height:36px;padding:4px 10px">Personen ${e.ids.map(i => pedById(ped, i).n).join(', ')} zeigen</button>` : '(Genotypenanalyse)'}</li>`; }).join('')}</ul>
      <p style="margin-top:6px;font-size:.92rem" class="muted">Simuliert wurde: ${modeName(ped.trueMode)}.${cons.length > 1 ? ' Der Stammbaum allein kann das nicht beweisen.' : ''}</p></div>`;
    $$('[data-ev]', $('#tsol')).forEach(b => b.onclick = () => { const e = ev[+b.dataset.ev]; rings = {}; e.ids.forEach(i => rings[i] = 'hl'); draw(); const p = document.createElement('div'); p.className = 'fb show info'; p.innerHTML = EV_TEXT[e.t]; b.closest('li').appendChild(p); b.remove(); });
  };
  const doSet = () => mcBlock($('#tq2'), { q: (lv === 'R' ? '2. ' : '') + 'Welche Erbgänge sind möglich? Wähle alle aus.', opts: modes.map(modeName), multi: true, noShuffle: true, a: modes.map((k, i) => cons.indexOf(k) >= 0 ? i : -1).filter(i => i >= 0),
    ex: '', onDone: (right, tries) => { if (tries === 1) { res.push(right); if (right) addPoints(5); sol(); } } });
  if (lv === 'R') {
    const dom = MODES[cons[0]].dom;
    mcBlock($('#tq1'), { q: '1. Ist der Erbgang dominant oder rezessiv?', opts: ['dominant', 'rezessiv'], a: dom ? 0 : 1, noShuffle: true, ex: (dom ? EV_TEXT.aaN : EV_TEXT.nnA), onDone: (right, tries) => { if (tries === 1) { res.push(right); if (right) addPoints(3); const e = ev.find(x => x.t === (dom ? 'aaN' : 'nnA')); if (e) { rings = {}; e.ids.forEach(i => rings[i] = 'hl'); draw(); } if (!$('#tq2').innerHTML) doSet(); } } });
  } else doSet();
}
function newTrain() {
  trainSeed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  trainPed = generatePedigree(S.level, trainSeed) || generatePedigree(S.level, trainSeed + 1);
  trainPed.level = S.level; trainPed.genLabels = true;
}

/* ---------- Quiz ---------- */
let QZ = null;
function buildQuiz(lv, retry) {
  if (retry) return { lv, qs: retry, i: 0, ans: [], practice: true };
  const pool = shuffle(QUIZ.filter(q => q.lv.indexOf(lv) >= 0)).slice(0, 8);
  const pp = shuffle(QUIZ_PED.filter(q => q.lv.indexOf(lv) >= 0)).slice(0, 3);
  const g = generatePedigree(lv, (Date.now() & 0xffffff) + 17); if (g) g.genLabels = true;
  const qs = shuffle(pool.map(q => Object.assign({ kind: 'mc' }, q)).concat(pp.map(q => Object.assign({}, q, { pedObj: PEDS[q.ped] })))).concat(g ? [{ kind: 'set', cat: 'ped', pedObj: g }] : []);
  return { lv, qs, i: 0, ans: [], practice: false };
}
function pgQuiz(m) {
  const lv = S.level;
  if (!QZ || QZ.lv !== lv) QZ = null;
  if (!QZ) {
    const best = S.best[lv];
    m.innerHTML = `<div class="section-head"><div class="eyebrow">Selbsttest</div><h2>Quiz: Wie gut kannst du Stammbäume analysieren?</h2>
      <p>12 Fragen auf dem Niveau <b>${LVN[lv]}</b>, darunter Stammbäume zum Antippen und ein zufällig erzeugter Stammbaum. Jede Frage hat genau einen Versuch. Am Ende siehst du dein Kompetenzprofil.</p></div>
      <div class="card"><div class="kpi"><div><span class="muted">Bestwert</span><b>${best ? best.pct + ' %' : '–'}</b></div><div><span class="muted">Punkte pro richtiger Antwort</span><b>10</b></div><div><span class="muted">Fragen</span><b>12</b></div></div>
      <p class="muted" style="margin-top:10px;font-size:.92rem">Punkte zählen für deinen Bestwert: Verbesserst du dich, erhältst du die zusätzlichen Punkte.</p>
      <div class="btnrow" style="margin-top:12px"><button class="btn primary" id="qstart">Quiz starten</button></div></div>`;
    $('#qstart').onclick = () => { QZ = buildQuiz(lv); pgQuiz(m); };
    return;
  }
  if (QZ.i >= QZ.qs.length) return quizResult(m);
  const q = QZ.qs[QZ.i], n = QZ.qs.length;
  m.innerHTML = `<div class="quizhead"><div><div class="eyebrow">${QZ.practice ? 'Übungsrunde' : 'Quiz'} · ${LVN[lv]} · ${CATS[q.cat]}</div><h2>Frage ${QZ.i + 1} von ${n}</h2></div><div class="pts">${QZ.ans.filter(Boolean).length} richtig</div></div>
    <div class="meter" style="margin-bottom:14px"><i style="width:${100 * QZ.i / n}%"></i></div>
    <div id="qbody"></div><div class="btnrow" style="margin-top:12px"><button class="btn primary" id="qnext" hidden>${QZ.i === n - 1 ? 'Auswertung' : 'Nächste Frage'}</button></div>`;
  const body = $('#qbody'), next = $('#qnext');
  const done = right => { if (QZ.ans.length === QZ.i) QZ.ans.push(right); next.hidden = false; };
  next.onclick = () => { QZ.i++; pgQuiz(m); window.scrollTo({ top: 0 }); };
  if (q.kind === 'mc') {
    body.innerHTML = '<div class="card" id="qc"></div>';
    mcBlock($('#qc'), { q: q.q, opts: q.o, a: q.a, ex: q.ex, onDone: (r, t) => { if (t === 1) done(r); $('#qc .chk').hidden = true; } });
    return;
  }
  const ped = q.pedObj, modes = MODES_BY_LEVEL[lv], ev = evidence(ped);
  body.innerHTML = `<div class="wiz"><div class="card" style="padding:12px"><div class="pedwrap" id="qped"></div>${legendHTML(ped)}</div><div class="side card" id="qside"></div></div>`;
  let rings = {}; const draw = () => { $('#qped').innerHTML = renderPed(ped, { rings, tap: q.kind === 'tap' }); }; draw();
  if (q.kind === 'tap') {
    $('#qside').innerHTML = `<div class="qtitle">${q.q}</div><div class="tapprompt">Tippe im Stammbaum.</div><div class="fb"></div>`;
    let locked = false;
    bindTap($('#qped'), id => {
      if (locked) return; locked = true;
      const right = !!q.ok(id, ev); rings = { [id]: right ? 'ok' : 'bad' }; draw();
      const fb = $('#qside .fb'); fb.className = 'fb show ' + (right ? 'ok' : 'bad'); fb.innerHTML = `<b class="v">${right ? 'Richtig' : 'Falsch'} – ${pLabel(ped, id)}.</b>${q.ex}`; done(right);
    });
  } else {
    const cons = consistentModes(ped, modes);
    $('#qside').innerHTML = '<div id="qs"></div>';
    mcBlock($('#qs'), { q: 'Welche Erbgänge sind mit diesem Stammbaum vereinbar? Wähle alle aus.', opts: modes.map(modeName), multi: true, noShuffle: true, a: modes.map((k, i) => cons.indexOf(k) >= 0 ? i : -1).filter(i => i >= 0),
      ex: '<ul class="clean">' + modes.filter(k => cons.indexOf(k) < 0).map(k => { const e = ev.find(x => x.ex.indexOf(k) >= 0); return `<li><b>${modeName(k)}</b> ausgeschlossen${e ? ': Personen ' + e.ids.map(i => pedById(ped, i).n).join(', ') : ''}</li>`; }).join('') + '</ul>',
      onDone: (r, t) => { if (t === 1) { done(r); const e = ev.find(x => x.t === 'nnA' || x.t === 'aaN'); if (e) { e.ids.forEach(i => rings[i] = 'hl'); draw(); } } $('#qs .chk').hidden = true; } });
  }
}
function quizResult(m) {
  const lv = QZ.lv, n = QZ.qs.length, ok = QZ.ans.filter(Boolean).length, pct = Math.round(100 * ok / n);
  let gained = 0;
  if (!QZ.practice && !QZ.saved) {
    QZ.saved = true; const old = S.best[lv] ? S.best[lv].ok : 0;
    if (ok > old) { gained = (ok - old) * 10; S.best[lv] = { ok, n, pct }; addPoints(gained, '+' + gained + ' Punkte (neuer Bestwert)'); }
    S.done['quiz:' + lv + ':' + Date.now()] = 0; save();
  }
  const cats = {}; QZ.qs.forEach((q, i) => { const c = cats[q.cat] || (cats[q.cat] = [0, 0]); c[1]++; if (QZ.ans[i]) c[0]++; });
  const msg = pct >= 90 ? ['Stammbaum-Profi', 'Du analysierst Stammbäume sicher und begründest fachlich korrekt.'] : pct >= 70 ? ['Sicher unterwegs', 'Du beherrschst die meisten Schritte. Wiederhole gezielt die schwächeren Bereiche.'] : pct >= 50 ? ['Auf dem Weg', 'Die Grundlagen sitzen teilweise. Arbeite die „Fälle“ noch einmal Schritt für Schritt durch.'] : ['Noch einmal üben', 'Beginne mit dem Prüfschema und den Grundlagen. Danach helfen die geführten Fälle.'];
  const wrong = QZ.qs.filter((q, i) => !QZ.ans[i]);
  m.innerHTML = `<div class="section-head"><div class="eyebrow">${QZ.practice ? 'Übungsrunde' : 'Auswertung'} · ${LVN[lv]}</div><h2>${msg[0]}</h2><p>${msg[1]}</p></div>
    <div class="grid2"><div class="card"><div class="big">${pct} %</div><p><b>${ok} von ${n}</b> Fragen richtig${QZ.practice ? '' : ` · ${gained ? `<b>+${gained} Punkte</b> (neuer Bestwert)` : 'kein neuer Bestwert'}`}</p>
      <div class="meter" style="margin-top:10px"><i style="width:${pct}%"></i></div></div>
      <div class="card bars"><h3>Kompetenzprofil</h3>${Object.keys(cats).map(c => { const [a, b] = cats[c]; return `<div class="row"><span>${CATS[c]}</span><div class="meter"><i style="width:${100 * a / b}%;background:${a / b >= .7 ? 'var(--ok)' : a / b >= .5 ? 'var(--hl)' : 'var(--bad)'}"></i></div><span style="text-align:right">${a}/${b}</span></div>`; }).join('')}</div></div>
    <div class="btnrow" style="margin-top:16px"><button class="btn primary" id="qagain">Neues Quiz</button>${wrong.length ? `<button class="btn" id="qwrong">Falsche Fragen üben (${wrong.length})</button>` : ''}<button class="btn ghost" id="qcases">Zu den Fällen</button></div>`;
  $('#qagain').onclick = () => { QZ = buildQuiz(lv); pgQuiz(m); };
  if ($('#qwrong')) $('#qwrong').onclick = () => { QZ = buildQuiz(lv, wrong); pgQuiz(m); };
  $('#qcases').onclick = () => go('cases');
}

/* ================= Start ================= */
function init() {
  buildNav();
  $$('.levels button').forEach(b => b.onclick = () => setLevel(b.dataset.lv));
  $('#wsbtn').onclick = () => openDrawer(wsHTML());
  $('#tnotes').onclick = () => openDrawer(`<h2>Hinweise für Lehrkräfte</h2><p class="muted">Fachliche Prüfung der Selbstlernkartei „Stammbäume“ (v3) und Änderungen auf dieser Website.</p><ul class="clean" style="margin-top:10px">${TEACHER_NOTES.map(n => `<li style="margin:10px 0">${n}</li>`).join('')}</ul>`);
  $('#reset').onclick = () => { if (confirm('Alle Punkte und Fortschritte auf diesem Gerät löschen?')) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } };
  $$('#drawer .scrim, #drawer .close').forEach(x => x.onclick = () => $('#drawer').classList.remove('open'));
  updateHeader(); render();
}
init();

</script>
</body>
