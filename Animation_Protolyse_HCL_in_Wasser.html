<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Säure-Base Reaktion (Teilchenmodell)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #475569;
            margin-top: -6px;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }
    </style>
</head>
<body class="font-sans text-gray-800">

    <!-- UI Overlay -->
    <div class="absolute top-4 left-4 glass-panel p-4 rounded-xl z-10 max-w-sm">
        <h1 class="text-xl font-bold mb-2 text-slate-800">HCl in Wasser (Protolyse)</h1>
        <div class="space-y-2 text-sm">
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full bg-blue-400 border border-slate-300"></div>
                <span>Wasser (H₂O) - Lösungsmittel</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full bg-yellow-400 border border-slate-300"></div>
                <span>Chlorwasserstoff (HCl)</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full bg-red-500 border border-slate-300 shadow-[0_0_5px_rgba(239,68,68,0.6)]"></div>
                <span>Oxoniumion (H₃O⁺)</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full bg-green-600 border border-slate-300"></div>
                <span>Chloridion (Cl⁻)</span>
            </div>
        </div>
        
        <div class="mt-4 border-t pt-3 border-gray-200">
            <p class="text-xs text-gray-500 mb-2 font-mono">HCl + H₂O ⇌ H₃O⁺ + Cl⁻</p>
            
            <!-- Buttons -->
            <div class="flex gap-2 mb-3">
                <button id="addHCl" class="flex-1 bg-slate-800 text-white px-2 py-2 rounded hover:bg-slate-700 transition active:scale-95 text-xs font-bold">
                    + HCl
                </button>
                <button id="pauseSim" class="flex-1 bg-amber-100 text-amber-700 px-2 py-2 rounded hover:bg-amber-200 transition active:scale-95 text-xs font-bold">
                    Pause
                </button>
                <button id="resetSim" class="bg-red-100 text-red-600 px-2 py-2 rounded hover:bg-red-200 transition active:scale-95 text-xs font-bold">
                    Reset
                </button>
            </div>

            <!-- Speed Slider -->
            <div class="flex flex-col gap-1 mb-2">
                <div class="flex justify-between text-xs text-gray-500 font-bold">
                    <span>Geschwindigkeit</span>
                    <span id="speedValue">1.0x</span>
                </div>
                <input type="range" id="speedSlider" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full">
            </div>

            <div class="mt-2 text-xs text-gray-500 border-t border-gray-100 pt-2">
                Statistik: <span id="stats">Wird geladen...</span>
            </div>
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

<script>
/**
 * KONFIGURATION & KONSTANTEN
 */
const TYPES = {
    H2O: 0,
    HCL: 1,
    H3O: 2,
    CL: 3
};

// Farben und Radien für die Visualisierung
const PARTICLE_CONFIG = {
    [TYPES.H2O]: { color: '#60A5FA', radius: 12, mass: 18, label: 'H2O' }, // Blau
    [TYPES.HCL]: { color: '#FACC15', radius: 13, mass: 36, label: 'HCl' }, // Gelb
    [TYPES.H3O]: { color: '#EF4444', radius: 14, mass: 19, label: 'H3O+' }, // Rot (Sauer)
    [TYPES.CL]:  { color: '#16A34A', radius: 14, mass: 35, label: 'Cl-' }   // Grün
};

// Wahrscheinlichkeiten
const REACTION_PROB_FORWARD = 1.0; // HCl + H2O -> H3O+ + Cl- (Sehr wahrscheinlich)
const REACTION_PROB_REVERSE = 0.2; // H3O+ + Cl- -> HCl + H2O (Häufiger: 20%)

class Simulation {
    constructor() {
        this.canvas = document.getElementById('simCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.paused = false;
        this.speedFactor = 1.0; // Standardgeschwindigkeit
        
        // Grid für Performance-Optimierung (Spatial Hashing)
        this.gridSize = 40;
        this.grid = {};

        this.resize();
        window.addEventListener('resize', () => this.resize());

        this.initParticles();
        this.loop();
        
        // Event Listeners
        document.getElementById('addHCl').addEventListener('click', () => this.injectHCl(5));
        document.getElementById('resetSim').addEventListener('click', () => this.initParticles());
        
        // Pause Button Listener
        const pauseBtn = document.getElementById('pauseSim');
        pauseBtn.addEventListener('click', () => {
            this.paused = !this.paused;
            pauseBtn.textContent = this.paused ? "Weiter" : "Pause";
            if (this.paused) {
                pauseBtn.classList.remove('bg-amber-100', 'text-amber-700');
                pauseBtn.classList.add('bg-green-100', 'text-green-700');
            } else {
                pauseBtn.classList.add('bg-amber-100', 'text-amber-700');
                pauseBtn.classList.remove('bg-green-100', 'text-green-700');
            }
        });

        // Speed Slider Listener
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        speedSlider.addEventListener('input', (e) => {
            this.speedFactor = parseFloat(e.target.value);
            speedValue.textContent = this.speedFactor.toFixed(1) + 'x';
        });
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
    }

    initParticles() {
        this.particles = [];
        // Sehr viele Wasserteilchen erzeugen
        const area = this.width * this.height;
        const particleCount = Math.min(Math.floor(area / 1800), 400); 

        for (let i = 0; i < particleCount; i++) {
            this.spawnParticle(TYPES.H2O);
        }
    }

    injectHCl(count) {
        for(let i=0; i<count; i++) {
            this.spawnParticle(TYPES.HCL);
        }
    }

    spawnParticle(type) {
        const radius = PARTICLE_CONFIG[type].radius;
        let x, y, safe;
        let attempts = 0;
        
        do {
            x = Math.random() * (this.width - 2 * radius) + radius;
            y = Math.random() * (this.height - 2 * radius) + radius;
            safe = true;
            
            for (let p of this.particles) {
                const dx = p.x - x;
                const dy = p.y - y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < p.radius + radius) {
                    safe = false;
                    break;
                }
            }
            attempts++;
        } while (!safe && attempts < 50);

        if (safe) {
            this.particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                type: type,
                radius: radius,
                mass: PARTICLE_CONFIG[type].mass
            });
        }
    }

    update() {
        // Grid leeren
        this.grid = {};

        // 1. Bewegung (unter Berücksichtigung des SpeedFactors)
        this.particles.forEach((p, index) => {
            p.x += p.vx * this.speedFactor;
            p.y += p.vy * this.speedFactor;

            // Ins Grid einsortieren
            const gridKey = `${Math.floor(p.x / this.gridSize)},${Math.floor(p.y / this.gridSize)}`;
            if (!this.grid[gridKey]) this.grid[gridKey] = [];
            this.grid[gridKey].push(index);
        });

        // 2. Teilchenkollisionen und Reaktionen
        const checkedPairs = new Set();

        this.particles.forEach((p1, i) => {
            const gx = Math.floor(p1.x / this.gridSize);
            const gy = Math.floor(p1.y / this.gridSize);

            // Nachbarzellen prüfen
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    const key = `${gx + x},${gy + y}`;
                    const cellParticles = this.grid[key];
                    
                    if (cellParticles) {
                        cellParticles.forEach(j => {
                            if (i === j) return; 
                            
                            const pairId = i < j ? `${i},${j}` : `${j},${i}`;
                            if (checkedPairs.has(pairId)) return;
                            checkedPairs.add(pairId);

                            const p2 = this.particles[j];
                            this.resolveCollision(p1, p2);
                        });
                    }
                }
            }
        });

        // 3. Wandkollisionen
        this.particles.forEach(p => {
            if (p.x - p.radius < 0) { 
                p.x = p.radius + 1; 
                p.vx = Math.abs(p.vx); 
            }
            if (p.x + p.radius > this.width) { 
                p.x = this.width - p.radius - 1; 
                p.vx = -Math.abs(p.vx); 
            }
            if (p.y - p.radius < 0) { 
                p.y = p.radius + 1; 
                p.vy = Math.abs(p.vy); 
            }
            if (p.y + p.radius > this.height) { 
                p.y = this.height - p.radius - 1; 
                p.vy = -Math.abs(p.vy); 
            }
        });
        
        this.updateStats();
    }

    resolveCollision(p1, p2) {
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const distSq = dx*dx + dy*dy;
        const minDist = p1.radius + p2.radius;

        if (distSq < minDist * minDist) {
            const dist = Math.sqrt(distSq);

            // --- 1. Physikalischer Stoß ---
            const nx = dx / dist;
            const ny = dy / dist;

            const dvx = p1.vx - p2.vx;
            const dvy = p1.vy - p2.vy;
            
            const velAlongNormal = dvx * nx + dvy * ny;

            // Überlappung korrigieren
            const overlap = (minDist - dist + 0.5) / 2;
            
            p1.x -= nx * overlap;
            p1.y -= ny * overlap;
            p2.x += nx * overlap;
            p2.y += ny * overlap;

            // Wenn sie sich voneinander wegbewegen, abbrechen
            if (velAlongNormal < 0) return;

            // Impulserhaltung
            const restitution = 1.0; 
            const j = -(1 + restitution) * velAlongNormal;
            
            const invMass1 = 1 / p1.mass; 
            const invMass2 = 1 / p2.mass;
            const impulseScalar = j / (invMass1 + invMass2);

            const impulseX = impulseScalar * nx;
            const impulseY = impulseScalar * ny;

            p1.vx += impulseX * invMass1;
            p1.vy += impulseY * invMass1;
            p2.vx -= impulseX * invMass2;
            p2.vy -= impulseY * invMass2;

            // --- 2. Chemische Reaktion ---
            this.handleChemistry(p1, p2);
        }
    }

    handleChemistry(p1, p2) {
        // Fall 1: HCl + H2O -> H3O+ + Cl- (Hinreaktion)
        let hcl = null;
        let h2o = null;

        if (p1.type === TYPES.HCL && p2.type === TYPES.H2O) { hcl = p1; h2o = p2; }
        else if (p1.type === TYPES.H2O && p2.type === TYPES.HCL) { hcl = p2; h2o = p1; }

        if (hcl && h2o) {
            if (Math.random() < REACTION_PROB_FORWARD) {
                hcl.type = TYPES.CL;
                hcl.radius = PARTICLE_CONFIG[TYPES.CL].radius;
                
                h2o.type = TYPES.H3O;
                h2o.radius = PARTICLE_CONFIG[TYPES.H3O].radius;
            }
            return;
        }

        // Fall 2: H3O+ + Cl- -> HCl + H2O (Rückreaktion)
        let h3o = null;
        let cl = null;

        if (p1.type === TYPES.H3O && p2.type === TYPES.CL) { h3o = p1; cl = p2; }
        else if (p1.type === TYPES.CL && p2.type === TYPES.H3O) { h3o = p2; cl = p1; }

        if (h3o && cl) {
            if (Math.random() < REACTION_PROB_REVERSE) {
                cl.type = TYPES.HCL;
                cl.radius = PARTICLE_CONFIG[TYPES.HCL].radius;

                h3o.type = TYPES.H2O;
                h3o.radius = PARTICLE_CONFIG[TYPES.H2O].radius;
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        this.particles.forEach(p => {
            this.ctx.save();
            this.ctx.translate(p.x, p.y);
            
            // Hauptatom
            this.ctx.beginPath();
            this.ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
            this.ctx.fillStyle = PARTICLE_CONFIG[p.type].color;
            this.ctx.fill();
            this.ctx.strokeStyle = "rgba(0,0,0,0.1)";
            this.ctx.lineWidth = 1;
            this.ctx.stroke();

            // Atome (Wasserstoff)
            this.ctx.fillStyle = "white";
            const hRadius = p.radius * 0.4; 

            if (p.type === TYPES.H2O) {
                this.drawAtom(hRadius, -p.radius*0.6, -p.radius*0.6);
                this.drawAtom(hRadius, p.radius*0.6, -p.radius*0.6);
            } else if (p.type === TYPES.HCL) {
                this.drawAtom(hRadius, p.radius*0.7, -p.radius*0.7);
            } else if (p.type === TYPES.H3O) {
                this.drawAtom(hRadius, 0, -p.radius*0.7);
                this.drawAtom(hRadius, -p.radius*0.7, p.radius*0.5);
                this.drawAtom(hRadius, p.radius*0.7, p.radius*0.5);
                
                this.ctx.fillStyle = "rgba(255,255,255,0.7)";
                this.ctx.font = "10px Arial";
                this.ctx.textAlign = "center";
                this.ctx.textBaseline = "middle";
                this.ctx.fillText("+", 0, 0);
            } else if (p.type === TYPES.CL) {
                this.ctx.fillStyle = "rgba(255,255,255,0.7)";
                this.ctx.font = "12px Arial";
                this.ctx.textAlign = "center";
                this.ctx.textBaseline = "middle";
                this.ctx.fillText("-", 0, 0);
            }

            this.ctx.restore();
        });
    }

    drawAtom(r, x, y) {
        this.ctx.beginPath();
        this.ctx.arc(x, y, r, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.stroke();
    }

    updateStats() {
        if (Math.random() > 0.1) return;

        let counts = { [TYPES.H2O]: 0, [TYPES.HCL]: 0, [TYPES.H3O]: 0, [TYPES.CL]: 0 };
        this.particles.forEach(p => counts[p.type]++);

        const statsEl = document.getElementById('stats');
        statsEl.innerHTML = `
            <span class="text-blue-600 font-bold">${counts[TYPES.H2O]}</span> H₂O | 
            <span class="text-yellow-600 font-bold">${counts[TYPES.HCL]}</span> HCl | 
            <span class="text-red-600 font-bold">${counts[TYPES.H3O]}</span> H₃O⁺
        `;
    }

    loop() {
        if (!this.paused) {
            this.update();
        }
        this.draw();
        requestAnimationFrame(() => this.loop());
    }
}

window.onload = () => {
    const sim = new Simulation();
};

</script>
</body>
</html>
